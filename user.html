<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SYMPOVOY 사용자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=fpdwg3ytk5&autoload=false"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f8;
  --accent:#3b6ef5;--green:#18b96a;--red:#e74c3c;--yellow:#f59e0b;
  --text:#1a1d2e;--muted:#7b82a0;--border:#e2e5f0;--radius:16px;
}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo',sans-serif;min-height:100vh;overflow-x:hidden;}

/* 로그인 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:44px 32px;width:100%;max-width:380px;text-align:center;backdrop-filter:blur(20px);}
.login-logo{font-size:48px;margin-bottom:12px;}
.login-title{font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:4px;}
.login-title span{color:#4f8ef7;}
.login-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:32px;}
.login-input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px 16px;color:#fff;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit;}
.login-input::placeholder{color:rgba(255,255,255,.35);}
.login-input:focus{border-color:#4f8ef7;}
.login-btn{width:100%;background:#4f8ef7;border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px;font-family:inherit;transition:opacity .2s;}
.login-btn:hover{opacity:.9;}

/* 앱 */
.app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{font-size:17px;font-weight:900;}
.topbar-logo span{color:var(--accent);}
.topbar-user{font-size:12px;color:var(--muted);font-weight:600;}

/* 바텀 탭 */
.bottom-tab{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;transition:color .2s;}
.tab-item.active{color:var(--accent);}
.tab-item .tab-icon{font-size:22px;margin-bottom:2px;}
.content{padding:16px 16px 90px;}
.page{display:none;}
.page.active{display:block;}

/* 카드 */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
.section-title{font-size:15px;font-weight:800;margin-bottom:14px;}

/* 심포지엄 정보 */
.hotel-hero{background:linear-gradient(135deg,#1a1d2e,#2d3561);border-radius:var(--radius);padding:24px 20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;}
.hotel-hero::after{content:'🏨';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:60px;opacity:.15;}
.hotel-name{font-size:22px;font-weight:900;margin-bottom:4px;}
.hotel-date{font-size:13px;opacity:.7;margin-bottom:8px;}
.hotel-sympo{font-size:14px;font-weight:700;color:#4f8ef7;}

/* 추천장소 카드 */
.place-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:10px;}
.place-type-icon{font-size:28px;width:44px;text-align:center;flex-shrink:0;}
.place-info{flex:1;}
.place-name{font-size:14px;font-weight:800;margin-bottom:2px;}
.place-addr{font-size:11px;color:var(--muted);margin-bottom:4px;}
.place-tip{font-size:12px;color:var(--accent);background:rgba(59,110,245,.08);border-radius:6px;padding:5px 8px;display:inline-block;}
.place-nav-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* 지도 */
#naverMap{width:100%;height:340px;border-radius:var(--radius);margin-bottom:14px;}

/* 도장판 */
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stamp-item{background:var(--surface2);border-radius:12px;padding:14px 8px;text-align:center;border:2px solid transparent;transition:all .3s;}
.stamp-item.done{background:rgba(24,185,106,.08);border-color:var(--green);}
.stamp-icon{font-size:32px;margin-bottom:4px;}
.stamp-name{font-size:11px;font-weight:700;color:var(--muted);}
.stamp-item.done .stamp-name{color:var(--green);}
.stamp-check{font-size:10px;margin-top:2px;}

/* 점수 */
.score-hero{background:linear-gradient(135deg,var(--accent),#6c47d4);border-radius:var(--radius);padding:24px;text-align:center;color:#fff;margin-bottom:14px;}
.score-num{font-size:56px;font-weight:900;line-height:1;}
.score-label{font-size:13px;opacity:.8;margin-top:4px;}
.score-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.score-item{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 6px;text-align:center;}
.score-item-num{font-size:20px;font-weight:800;}
.score-item-label{font-size:10px;opacity:.8;margin-top:2px;}

/* 품목 입력 */
.item-list{margin-bottom:14px;}
.item-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.item-row input{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit;}
.item-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;}
.add-item-btn{width:100%;background:var(--surface2);border:1.5px dashed var(--border);border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;}
.add-item-btn:hover{border-color:var(--accent);color:var(--accent);}
.submit-btn{width:100%;background:var(--accent);border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px;font-family:inherit;box-shadow:0 4px 16px rgba(59,110,245,.3);}

/* GPS 인증 오버레이 */
.gps-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;flex-direction:column;}
.gps-overlay.show{display:flex;}
.gps-card{background:#fff;border-radius:28px;padding:40px 32px;text-align:center;width:90%;max-width:340px;}
.gps-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;}
.gps-sub{font-size:13px;color:var(--muted);margin-bottom:32px;}

/* 스핀 인터랙션 */
.spin-area{position:relative;width:160px;height:160px;margin:0 auto 32px;}
.spin-ring{position:absolute;inset:0;border-radius:50%;border:3px dashed #e2e5f0;animation:spinRing 4s linear infinite;}
@keyframes spinRing{to{transform:rotate(360deg);}}
.spin-img{width:120px;height:120px;border-radius:50%;object-fit:cover;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:4px solid #fff;box-shadow:0 8px 32px rgba(0,0,0,.15);cursor:grab;user-select:none;transition:transform .1s;font-size:64px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f7ff,#e8f4fd);}
.spin-hint{font-size:12px;color:var(--muted);margin-bottom:16px;}
.spin-progress{width:100%;height:6px;background:#f0f2f8;border-radius:3px;overflow:hidden;}
.spin-bar{height:100%;background:linear-gradient(90deg,var(--accent),#6c47d4);border-radius:3px;width:0%;transition:width .1s;}

/* 완료 애니메이션 */
.complete-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;align-items:center;justify-content:center;flex-direction:column;}
.complete-overlay.show{display:flex;}
.complete-card{text-align:center;color:#fff;padding:40px 20px;}
.complete-icon{font-size:80px;margin-bottom:20px;animation:popIn .5s cubic-bezier(.68,-.55,.27,1.55);}
@keyframes popIn{0%{transform:scale(0);}100%{transform:scale(1);}}
.complete-title{font-size:28px;font-weight:900;margin-bottom:8px;}
.complete-sub{font-size:14px;opacity:.7;margin-bottom:32px;}
.complete-score{font-size:48px;font-weight:900;color:#4f8ef7;margin-bottom:8px;}
.complete-btn{background:#fff;color:#1a1d2e;border:none;border-radius:14px;padding:14px 40px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}

/* 아젠다 */
.agenda-img{width:100%;border-radius:12px;margin-top:8px;}

/* 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(40px);background:#1a1d2e;color:#fff;padding:12px 24px;border-radius:40px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* 배지 */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:rgba(24,185,106,.12);color:var(--green);}
.badge-blue{background:rgba(59,110,245,.12);color:var(--accent);}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🌿</div>
    <div class="login-title">SYMPO<span>VOY</span></div>
    <p class="login-sub">심포지엄 도장깨기</p>
    <input class="login-input" id="lName" placeholder="이름">
    <input class="login-input" id="lHospital" placeholder="병원명">
    <input class="login-input" id="lLicense" placeholder="면허번호">
    <button class="login-btn" onclick="doLogin()">시작하기</button>
  </div>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-logo">SYMPO<span>VOY</span></div>
    <div class="topbar-user" id="topUser"></div>
  </div>

  <div class="content">

    <!-- 초대장 -->
    <div class="page active" id="page-invite">
      <div id="inviteContent">
        <div style="text-align:center;padding:40px 20px;color:var(--muted)">
          <div style="font-size:40px;margin-bottom:12px">🔗</div>
          <div style="font-size:15px;font-weight:700;margin-bottom:6px">초대장이 없습니다</div>
          <div style="font-size:13px">소개자에게 초대 링크를 받아주세요</div>
        </div>
      </div>
    </div>

    <!-- 지도 -->
    <div class="page" id="page-map">
      <div class="section-title">📍 내 위치 & 미션 장소</div>
      <div id="naverMap"></div>
      <div id="mapPlaceList"></div>
    </div>

    <!-- 도장판 -->
    <div class="page" id="page-stamp">
      <div class="score-hero">
        <div class="score-num" id="totalScore">0</div>
        <div class="score-label">누적 점수</div>
        <div class="score-breakdown">
          <div class="score-item"><div class="score-item-num" id="gpsTotal">0</div><div class="score-item-label">방문인증</div></div>
          <div class="score-item"><div class="score-item-num" id="photoTotal">0</div><div class="score-item-label">사진업로드</div></div>
          <div class="score-item"><div class="score-item-num" id="itemTotal">0</div><div class="score-item-label">품목승인</div></div>
        </div>
      </div>
      <div class="section-title">🏅 방문 도장</div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>

    <!-- 품목 입력 -->
    <div class="page" id="page-items">
      <div class="card">
        <div class="section-title">💊 강의 품목 등록</div>
        <div class="item-list" id="itemList"></div>
        <button class="add-item-btn" onclick="addItemRow()">+ 품목 추가</button>
        <button class="submit-btn" onclick="submitItems()">전송하기</button>
      </div>
      <div class="card">
        <div class="section-title">📋 제출 이력</div>
        <div id="itemHistory"><div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">로딩 중...</div></div>
      </div>
    </div>

  </div>

  <!-- 바텀 탭 -->
  <div class="bottom-tab">
    <div class="tab-item active" onclick="switchTab(this,'invite')">
      <span class="tab-icon">📨</span>초대장
    </div>
    <div class="tab-item" onclick="switchTab(this,'map')">
      <span class="tab-icon">🗺️</span>지도
    </div>
    <div class="tab-item" onclick="switchTab(this,'stamp')">
      <span class="tab-icon">🏅</span>도장판
    </div>
    <div class="tab-item" onclick="switchTab(this,'items')">
      <span class="tab-icon">💊</span>품목
    </div>
  </div>
</div>

<!-- GPS 인증 오버레이 -->
<div class="gps-overlay" id="gpsOverlay">
  <div class="gps-card">
    <div class="gps-title" id="gpsHotelName">🏨 호텔 도착!</div>
    <div class="gps-sub">아래 로고를 돌려서 방문을 인증하세요</div>
    <div class="spin-area">
      <div class="spin-ring"></div>
      <div class="spin-img" id="spinImg">🌿</div>
    </div>
    <div class="spin-hint">손가락으로 빙글 돌려보세요</div>
    <div class="spin-progress"><div class="spin-bar" id="spinBar"></div></div>
  </div>
</div>

<!-- 완료 오버레이 -->
<div class="complete-overlay" id="completeOverlay">
  <div class="complete-card">
    <div class="complete-icon">✅</div>
    <div class="complete-title">방문 인증 완료!</div>
    <div class="complete-sub" id="completeHotelName"></div>
    <div class="complete-score">+10점</div>
    <div style="font-size:13px;opacity:.6;margin-bottom:32px">방문 인증 점수가 적립되었습니다</div>
    <button class="complete-btn" onclick="afterComplete()">사진 업로드하기 📸</button>
  </div>
</div>

<!-- 사진 업로드 (숨김) -->
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(this)">

<script>
const SB_URL='https://sgmmeibexipozsywxpyk.supabase.co';
const SB_KEY='sb_publishable_rWGxXiyqq493Vu6cqNyfCA_8DfSMqqQ';
const sb=supabase.createClient(SB_URL,SB_KEY);

let currentUser=null;
let currentInvite=null;
let currentJourney=null;
let inviteLocations=[];
let currentVisitId=null;
let naverMap=null;
let spinRotation=0;
let spinActive=false;
let spinStartAngle=0;
let totalSpinAngle=0;
let lastAngle=0;

// 토스트
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// 로그인
async function doLogin(){
  const name=document.getElementById('lName').value.trim();
  const hospital=document.getElementById('lHospital').value.trim();
  const license=document.getElementById('lLicense').value.trim();
  if(!name||!hospital||!license){toast('모두 입력해주세요');return;}

  let {data}=await sb.from('users').select('*').eq('name',name).eq('hospital',hospital).eq('license_number',license).single();
  if(!data){
    const res=await sb.from('users').insert({name,hospital,license_number:license}).select().single();
    data=res.data;
  }
  if(!data){toast('오류가 발생했습니다');return;}
  if(!data.is_approved){
    toast('관리자 승인 후 이용 가능합니다');return;
  }
  currentUser=data;
  localStorage.setItem('user_session',JSON.stringify(data));
  enterApp();
}

function enterApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('topUser').textContent=currentUser.name+' · '+currentUser.hospital;
  // URL에 초대코드 있으면 자동 로드
  const params=new URLSearchParams(location.search);
  const code=params.get('invite');
  if(code) loadInvite(code);
  loadStamp();
  loadItemHistory();
  startGPSWatch();
}

// 자동 로그인
window.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('user_session');
  if(saved){
    currentUser=JSON.parse(saved);
    // 승인 여부 재확인
    sb.from('users').select('is_approved').eq('id',currentUser.id).single().then(({data})=>{
      if(data?.is_approved){enterApp();}
      else{localStorage.removeItem('user_session');}
    });
  }
});

// 탭
function switchTab(el,id){
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+id).classList.add('active');
  if(id==='map')initMap();
}

// 초대장 로드
async function loadInvite(code){
  const {data:pkg}=await sb.from('invite_packages').select('*').eq('invite_code',code).single();
  if(!pkg){document.getElementById('inviteContent').innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">유효하지 않은 초대장입니다</div>';return;}
  currentInvite=pkg;
  const {data:journey}=await sb.from('journeys').select('*').eq('id',pkg.journey_id).single();
  currentJourney=journey;
  const {data:locs}=await sb.from('invite_locations').select('*').eq('invite_id',pkg.id);
  inviteLocations=locs||[];

  const typeIcon={restaurant:'🍽️',attraction:'🏛️',cafe:'☕',shopping:'🛍️'};
  const concepts={
    1:'background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;',
    2:'background:linear-gradient(135deg,#fff9f0,#fff3dc);color:#1a1d2e;border:2px solid #f59e0b;',
    3:'background:linear-gradient(135deg,#f0f7ff,#e8f4fd);color:#1a1d2e;border-left:5px solid #3b6ef5;'
  };

  const period=journey.symposium_date+(journey.symposium_date_end?' ~ '+journey.symposium_date_end:'');

  document.getElementById('inviteContent').innerHTML=`
    <div style="${concepts[pkg.concept]||concepts[1]}border-radius:16px;padding:24px;margin-bottom:14px;">
      <div style="font-size:11px;opacity:.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">초대장</div>
      <div style="font-size:24px;font-weight:900;margin-bottom:4px">🏨 ${journey.hotel_name}</div>
      <div style="font-size:13px;opacity:.7;margin-bottom:8px">📅 ${period||'날짜 미정'}</div>
      ${journey.symposium_name?`<div style="font-size:14px;font-weight:700;color:#4f8ef7">🎓 ${journey.symposium_name}</div>`:''}
      ${pkg.custom_message?`<div style="font-size:13px;margin-top:12px;opacity:.85;border-left:3px solid currentColor;padding-left:10px">${pkg.custom_message}</div>`:''}
    </div>
    ${journey.agenda_image_url?`
      <div class="card">
        <div class="section-title">📄 아젠다</div>
        <img src="${journey.agenda_image_url}" class="agenda-img">
      </div>
    `:''}
    ${inviteLocations.length?`
      <div class="card">
        <div class="section-title">🗺️ 추천 장소</div>
        ${inviteLocations.map(l=>`
          <div class="place-card">
            <div class="place-type-icon">${typeIcon[l.place_type]||'📍'}</div>
            <div class="place-info">
              <div class="place-name">${l.place_name}</div>
              ${l.address?`<div class="place-addr">${l.address}</div>`:''}
              ${l.tip?`<div class="place-tip">💬 ${l.tip}</div>`:''}
            </div>
            <button class="place-nav-btn" onclick="openNaver('${l.place_name}',${l.place_lat},${l.place_lng})">길찾기</button>
          </div>
        `).join('')}
      </div>
    `:''}
  `;
}

function openNaver(name,lat,lng){
  window.open(`https://map.naver.com/v5/search/${encodeURIComponent(name)}`,'_blank');
}

// 네이버 지도
function initMap(){
  if(naverMap||!currentJourney)return;
  naver.maps.onJSContentLoaded=function(){};
  naver.maps.load(function(){
    const center=new naver.maps.LatLng(currentJourney.hotel_lat||37.5665,currentJourney.hotel_lng||126.9780);
    naverMap=new naver.maps.Map('naverMap',{center,zoom:15,mapTypeControl:false,logoControl:false});
    // 호텔 마커
    new naver.maps.Marker({position:center,map:naverMap,title:currentJourney.hotel_name,
      icon:{content:`<div style="background:#3b6ef5;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(59,110,245,.4)">🏨 ${currentJourney.hotel_name}</div>`}
    });
    // 추천장소 마커
    inviteLocations.forEach(l=>{
      const pos=new naver.maps.LatLng(l.place_lat,l.place_lng);
      new naver.maps.Marker({position:pos,map:naverMap,title:l.place_name,
        icon:{content:`<div style="background:#fff;border:2px solid #3b6ef5;color:#3b6ef5;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)">${l.place_name}</div>`}
      });
    });
  });
}

// GPS 감시
function startGPSWatch(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(pos=>{
    if(!currentJourney?.hotel_lat)return;
    const dist=getDistance(pos.coords.latitude,pos.coords.longitude,currentJourney.hotel_lat,currentJourney.hotel_lng);
    if(dist<=300&&!spinActive){
      checkAlreadyVisited();
    }
  },{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}

async function checkAlreadyVisited(){
  if(!currentUser||!currentJourney)return;
  const {data}=await sb.from('visits').select('id').eq('user_id',currentUser.id).eq('journey_id',currentJourney.id).single();
  if(data)return; // 이미 방문함
  showSpinOverlay();
}

function getDistance(lat1,lng1,lat2,lng2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 스핀 인터랙션
function showSpinOverlay(){
  spinActive=true;
  totalSpinAngle=0;
  spinRotation=0;
  document.getElementById('gpsHotelName').textContent='🏨 '+currentJourney.hotel_name;
  document.getElementById('spinBar').style.width='0%';
  document.getElementById('gpsOverlay').classList.add('show');
  initSpinTouch();
}

function initSpinTouch(){
  const img=document.getElementById('spinImg');
  const bar=document.getElementById('spinBar');
  const required=720; // 720도 회전 필요

  img.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    const rect=img.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    lastAngle=Math.atan2(t.clientY-cy,t.clientX-cx)*180/Math.PI;
  },{passive:true});

  img.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.touches[0];
    const rect=img.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    const angle=Math.atan2(t.clientY-cy,t.clientX-cx)*180/Math.PI;
    let delta=angle-lastAngle;
    if(delta>180)delta-=360;
    if(delta<-180)delta+=360;
    totalSpinAngle+=Math.abs(delta);
    spinRotation+=delta;
    lastAngle=angle;
    img.style.transform=`translate(-50%,-50%) rotate(${spinRotation}deg)`;
    const pct=Math.min(totalSpinAngle/required*100,100);
    bar.style.width=pct+'%';
    if(totalSpinAngle>=required) completeVisit();
  },{passive:false});
}

async function completeVisit(){
  if(!spinActive)return;
  spinActive=false;
  document.getElementById('gpsOverlay').classList.remove('show');
  // DB 저장
  const {data}=await sb.from('visits').insert({
    user_id:currentUser.id,
    journey_id:currentJourney.id,
    gps_score:10,
    photo_score:0,
    item_score:0
  }).select().single();
  if(data){
    currentVisitId=data.id;
    // 심포지엄 참석 이력도 저장
    await sb.from('symposium_history').insert({user_id:currentUser.id,journey_id:currentJourney.id});
  }
  document.getElementById('completeHotelName').textContent=currentJourney.hotel_name;
  document.getElementById('completeOverlay').classList.add('show');
  loadStamp();
}

function afterComplete(){
  document.getElementById('completeOverlay').classList.remove('show');
  document.getElementById('photoInput').click();
}

// 사진 업로드
async function uploadPhoto(input){
  const file=input.files[0];if(!file||!currentVisitId)return;
  toast('사진 업로드 중...');
  const path=`visit_${currentVisitId}_${Date.now()}.jpg`;
  const {error}=await sb.storage.from('agenda-images').upload(path,file,{upsert:true});
  if(error){toast('업로드 실패');return;}
  const {data:{publicUrl}}=sb.storage.from('agenda-images').getPublicUrl(path);
  await sb.from('visits').update({photo_url:publicUrl,photo_score:5}).eq('id',currentVisitId);
  toast('사진 업로드 완료! +5점');
  loadStamp();
}

// 도장판
async function loadStamp(){
  if(!currentUser)return;
  const {data:visits}=await sb.from('visits').select('*,journeys(hotel_name)').eq('user_id',currentUser.id);
  if(!visits)return;
  const gps=visits.reduce((s,v)=>s+(v.gps_score||0),0);
  const photo=visits.reduce((s,v)=>s+(v.photo_score||0),0);
  const item=visits.reduce((s,v)=>s+(v.item_score||0),0);
  document.getElementById('totalScore').textContent=gps+photo+item;
  document.getElementById('gpsTotal').textContent=gps;
  document.getElementById('photoTotal').textContent=photo;
  document.getElementById('itemTotal').textContent=item;
  document.getElementById('stampGrid').innerHTML=visits.map(v=>`
    <div class="stamp-item done">
      <div class="stamp-icon">✅</div>
      <div class="stamp-name">${(v.journeys?.hotel_name||'').slice(0,6)}</div>
      <div class="stamp-check" style="color:var(--green)">${(v.gps_score||0)+(v.photo_score||0)+(v.item_score||0)}점</div>
    </div>
  `).join('')||'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;grid-column:1/-1">아직 방문한 곳이 없습니다</div>';
}

// 품목
function addItemRow(){
  const list=document.getElementById('itemList');
  const div=document.createElement('div');
  div.className='item-row';
  div.innerHTML=`<span>💊</span><input placeholder="품목명 입력" type="text"><button class="item-del" onclick="this.parentNode.remove()">×</button>`;
  list.appendChild(div);
}

async function submitItems(){
  if(!currentJourney){toast('초대장을 먼저 확인하세요');return;}
  const inputs=document.querySelectorAll('#itemList .item-row input');
  const items=[...inputs].map(i=>i.value.trim()).filter(Boolean);
  if(!items.length){toast('품목을 입력해주세요');return;}
  await Promise.all(items.map(name=>sb.from('items').insert({user_id:currentUser.id,journey_id:currentJourney.id,item_name:name})));
  toast('품목 전송 완료!');
  document.getElementById('itemList').innerHTML='';
  loadItemHistory();
}

async function loadItemHistory(){
  if(!currentUser)return;
  const {data}=await sb.from('items').select('*,journeys(hotel_name)').eq('user_id',currentUser.id).order('submitted_at',{ascending:false});
  const el=document.getElementById('itemHistory');
  if(!data||!data.length){el.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">제출 이력 없음</div>';return;}
  el.innerHTML=data.map(i=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:14px;font-weight:700">${i.item_name}</div>
        <div style="font-size:11px;color:var(--muted)">${i.journeys?.hotel_name||'-'} · ${new Date(i.submitted_at).toLocaleDateString('ko-KR')}</div>
      </div>
      <span class="badge ${i.is_approved?'badge-green':'badge-blue'}">${i.is_approved?(i.approved_score||0)+'점':'검토중'}</span>
    </div>
  `).join('');
}
</script>
