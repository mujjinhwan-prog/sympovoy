<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYMPOVOY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0d1a;--accent:#4f8ef7;--accent2:#7c5cbf;
  --text:#e8eaf0;--muted:#8890a8;--border:#1e2338;
}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo',sans-serif;min-height:100vh;overflow-x:hidden;}

/* 배경 파티클 */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;}
.glow1{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(79,142,247,.12) 0%,transparent 70%);top:-100px;left:-100px;animation:float1 8s ease-in-out infinite;}
.glow2{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,191,.1) 0%,transparent 70%);bottom:-100px;right:-100px;animation:float2 10s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,30px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,-40px);}}

/* 레이아웃 */
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}

/* 로고 */
.logo-area{text-align:center;margin-bottom:60px;}
.logo-tree{font-size:64px;margin-bottom:16px;animation:treePulse 3s ease-in-out infinite;}
@keyframes treePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.logo-text{font-size:42px;font-weight:900;letter-spacing:-2px;margin-bottom:8px;}
.logo-text span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:15px;color:var(--muted);letter-spacing:1px;}

/* 카드 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:720px;}
.entry-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;cursor:pointer;transition:all .3s;text-decoration:none;color:var(--text);display:block;position:relative;overflow:hidden;}
.entry-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(79,142,247,.08),rgba(124,92,191,.08));opacity:0;transition:opacity .3s;}
.entry-card:hover{transform:translateY(-6px);border-color:rgba(79,142,247,.4);box-shadow:0 20px 60px rgba(79,142,247,.15);}
.entry-card:hover::before{opacity:1;}
.card-icon{font-size:44px;margin-bottom:16px;display:block;}
.card-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.card-arrow{display:inline-block;margin-top:14px;font-size:12px;color:var(--accent);font-weight:700;opacity:0;transform:translateX(-6px);transition:all .3s;}
.entry-card:hover .card-arrow{opacity:1;transform:translateX(0);}

/* 하단 */
.footer{margin-top:48px;text-align:center;color:var(--muted);font-size:12px;}
.footer strong{color:var(--accent);}

/* 버전 뱃지 */
.version{position:fixed;bottom:20px;right:20px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--muted);}

@media(max-width:600px){
  .card-grid{grid-template-columns:1fr;max-width:320px;}
  .logo-text{font-size:32px;}
  .logo-tree{font-size:48px;}
}
</style>
</head>
<body>

<div class="bg-glow">
  <div class="glow1"></div>
  <div class="glow2"></div>
</div>

<div class="wrap">
  <div class="logo-area">
    <div class="logo-tree">🌿</div>
    <div class="logo-text">SYMPO<span>VOY</span></div>
    <div class="logo-sub">유한양행 심포지엄 도장깨기</div>
  </div>

  <div class="card-grid">
    <a class="entry-card" href="admin.html">
      <span class="card-icon">🛡️</span>
      <div class="card-title">관리자</div>
      <div class="card-desc">심포지엄 등록 및 전체 현황 관리</div>
      <div class="card-arrow">입장하기 →</div>
    </a>
    <a class="entry-card" href="introducer.html">
      <span class="card-icon">🤝</span>
      <div class="card-title">소개자</div>
      <div class="card-desc">초대장 작성 및 참석 현황 확인</div>
      <div class="card-arrow">입장하기 →</div>
    </a>
    <a class="entry-card" href="user.html">
      <span class="card-icon">🏨</span>
      <div class="card-title">사용자</div>
      <div class="card-desc">초대장 확인 및 도장깨기 미션</div>
      <div class="card-arrow">입장하기 →</div>
    </a>
  </div>

  <div class="footer">
    Powered by <strong>Yuhan Corporation</strong> · VOY Platform
  </div>
</div>

<div class="version">v1.0</div>

</body>
</html>
