<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SYMPOVOY 사용자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f8;--accent:#3b6ef5;--green:#18b96a;--red:#e74c3c;--yellow:#f59e0b;--text:#1a1d2e;--muted:#7b82a0;--border:#e2e5f0;--radius:16px;}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--accent:#4f8ef7;--green:#2ecc71;--red:#e74c3c;--yellow:#f39c12;--text:#e8eaf0;--muted:#8890a8;--border:#2a2f45;}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo',sans-serif;min-height:100vh;}

/* 로그인 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 28px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:12px;}
.login-logo img{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.2);}
.login-title{font-size:24px;font-weight:900;color:#fff;text-align:center;margin-bottom:4px;}
.login-title span{color:#4f8ef7;}
.login-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px;text-align:center;}
.login-input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:13px 16px;color:#fff;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit;}
.login-input::placeholder{color:rgba(255,255,255,.35);}
.login-input:focus{border-color:#4f8ef7;}
.login-btn{width:100%;background:#4f8ef7;border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
.login-hint{font-size:12px;color:rgba(255,255,255,.4);text-align:center;margin-top:14px;line-height:1.6;}

/* 대기 */
.pending-wrap{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);flex-direction:column;text-align:center;}
.pending-icon{font-size:64px;margin-bottom:16px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.pending-info{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 20px;margin-bottom:20px;width:100%;max-width:340px;text-align:left;}
.p-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;}
.p-row:last-child{border-bottom:none;}
.p-label{color:rgba(255,255,255,.5);}
.p-val{color:#fff;font-weight:700;}

/* 앱 */
.app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:7px;}
.topbar-logo img{width:26px;height:26px;border-radius:50%;}
.topbar-logo span{font-size:16px;font-weight:900;}
.topbar-logo em{color:var(--accent);font-style:normal;}
.topbar-r{display:flex;align-items:center;gap:5px;}
.topbar-user{font-size:11px;color:var(--muted);font-weight:600;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-btn{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:4px 10px;font-size:11px;color:var(--text);cursor:pointer;font-family:inherit;}

/* 바텀 탭 */
.btab{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.btab-item{display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;}
.btab-item.active{color:var(--accent);}
.btab-icon{font-size:22px;margin-bottom:2px;}
.content{padding:0 0 80px;}
.page{display:none;}
.page.active{display:block;}

/* 초대장 그리드 */
.invite-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 14px;}
.ig-card{border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;border:2px solid var(--border);background:var(--surface);position:relative;overflow:hidden;}
.ig-card.past{opacity:.55;filter:grayscale(.4);}
.ig-card.upcoming{border-color:var(--accent);box-shadow:0 4px 16px rgba(59,110,245,.15);}
.ig-card .ig-num{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.ig-card .ig-hotel{font-size:13px;font-weight:800;line-height:1.3;margin-bottom:3px;}
.ig-card .ig-date{font-size:10px;color:var(--muted);}
.ig-card .ig-sympo{font-size:10px;color:var(--accent);margin-top:3px;}
.ig-card .ig-bar{position:absolute;top:0;left:0;right:0;height:4px;}
.ig-badge-new{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border-radius:10px;padding:2px 7px;font-size:9px;font-weight:700;}
.ig-badge-done{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:10px;padding:2px 7px;font-size:9px;font-weight:700;}
.ig-badge-past{position:absolute;top:8px;right:8px;background:var(--muted);color:#fff;border-radius:10px;padding:2px 7px;font-size:9px;font-weight:700;}

/* 초대장 상세 */
.back-btn{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;border-bottom:1px solid var(--border);background:var(--surface);}
.hotel-hero{border-radius:var(--radius);padding:22px 18px;color:#fff;margin:12px 14px;cursor:pointer;position:relative;overflow:hidden;}
.hotel-hero.c1{background:linear-gradient(135deg,#1a1d2e,#2d3561);}
.hotel-hero.c2{background:linear-gradient(135deg,#6b3a1f,#c17f24);}
.hotel-hero.c3{background:linear-gradient(135deg,#1a3a6e,#3b6ef5);}
.hotel-hero.past-hero{background:linear-gradient(135deg,#555,#888);cursor:default;}
.gps-hint{position:absolute;bottom:10px;right:12px;background:rgba(255,255,255,.25);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;}
.hotel-name{font-size:20px;font-weight:900;margin-bottom:4px;}
.hotel-date{font-size:12px;opacity:.75;margin-bottom:6px;}

/* 카드 */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:15px;margin:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.sec-title{font-size:14px;font-weight:800;margin-bottom:12px;}

/* 아젠다 */
.agenda-img{width:100%;max-height:500px;object-fit:contain;border-radius:10px;margin-top:8px;display:block;}

/* 추천 장소 */
.place-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--surface2);border-radius:12px;margin-bottom:10px;}
.place-icon{width:42px;height:42px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.place-icon img{width:100%;height:100%;object-fit:cover;}
.place-body{flex:1;min-width:0;}
.place-name{font-size:13px;font-weight:800;margin-bottom:2px;}
.place-type{font-size:10px;color:var(--accent);margin-bottom:2px;}
.place-addr{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:6px;}
.place-tip{font-size:11px;color:var(--accent);background:rgba(59,110,245,.08);border-radius:6px;padding:4px 8px;margin-bottom:7px;display:block;}
.place-btns{display:flex;gap:5px;flex-wrap:wrap;}
.pbtn{padding:5px 10px;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.pbtn-naver{background:#03c75a;color:#fff;}
.pbtn-nav{background:var(--accent);color:#fff;}
.pbtn-copy{background:var(--surface);border:1px solid var(--border);color:var(--text);}

/* 품목 */
.item-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.item-row input{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit;}
.item-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.add-item-btn{width:100%;background:var(--surface2);border:1.5px dashed var(--border);border-radius:10px;padding:11px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:10px;}
.submit-btn{width:100%;background:var(--accent);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;}
.item-history-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.item-history-row:last-child{border-bottom:none;}

/* 도장판 */
.score-hero{background:linear-gradient(135deg,var(--accent),#6c47d4);border-radius:var(--radius);padding:20px;text-align:center;color:#fff;margin:12px 14px;}
.score-num{font-size:50px;font-weight:900;line-height:1;}
.score-bd{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
.score-bd-item{background:rgba(255,255,255,.15);border-radius:10px;padding:9px 5px;text-align:center;}
.score-bd-num{font-size:18px;font-weight:800;}
.score-bd-label{font-size:10px;opacity:.8;margin-top:1px;}
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px 12px;}
.stamp-item{background:var(--surface2);border-radius:12px;padding:12px 6px;text-align:center;border:2px solid transparent;}
.stamp-item.done{background:rgba(24,185,106,.08);border-color:var(--green);}
.stamp-icon img{width:32px;height:32px;border-radius:50%;margin-bottom:4px;}
.stamp-name{font-size:10px;font-weight:700;color:var(--muted);}
.stamp-item.done .stamp-name{color:var(--green);}
.month-filter{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 0;}
.month-chip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:var(--surface2);}
.month-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* 배지 */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:rgba(24,185,106,.12);color:var(--green);}
.badge-blue{background:rgba(59,110,245,.12);color:var(--accent);}
.badge-yellow{background:rgba(245,158,11,.12);color:var(--yellow);}

/* 스핀 오버레이 */
.gps-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;align-items:center;justify-content:center;flex-direction:column;}
.gps-overlay.show{display:flex;}
.gps-card{background:#fff;border-radius:28px;padding:32px 24px;text-align:center;width:88%;max-width:320px;}
.gps-hotel-name{font-size:15px;font-weight:800;color:#1a1d2e;margin-bottom:4px;}
.gps-sub{font-size:12px;color:#7b82a0;margin-bottom:22px;}
.spin-area{position:relative;width:160px;height:160px;margin:0 auto 18px;}
.spin-ring{position:absolute;inset:0;border-radius:50%;border:3px dashed #e2e5f0;animation:spinRing 4s linear infinite;}
@keyframes spinRing{to{transform:rotate(360deg);}}
.spin-img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 32px rgba(0,0,0,.15);cursor:grab;user-select:none;background:#f0f7ff;}
.spin-img img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
.spin-hint{font-size:12px;color:#7b82a0;margin-bottom:10px;}
.spin-progress{width:100%;height:6px;background:#f0f2f8;border-radius:3px;overflow:hidden;}
.spin-bar{height:100%;background:linear-gradient(90deg,#3b6ef5,#6c47d4);border-radius:3px;width:0%;}
.gps-cancel{margin-top:14px;background:none;border:none;color:#7b82a0;font-size:13px;cursor:pointer;font-family:inherit;}

/* 완료 오버레이 */
.done-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;align-items:center;justify-content:center;flex-direction:column;}
.done-overlay.show{display:flex;}
.done-card{text-align:center;color:#fff;padding:36px 22px;}
.done-anim{font-size:76px;margin-bottom:14px;animation:popIn .5s cubic-bezier(.68,-.55,.27,1.55);}
@keyframes popIn{0%{transform:scale(0);}100%{transform:scale(1);}}
.done-btn{background:#fff;color:#1a1d2e;border:none;border-radius:14px;padding:13px 36px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;}
.done-skip{background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px;}

/* 토스트 */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(40px);background:#1a1d2e;color:#fff;padding:11px 20px;border-radius:40px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo"><img src="https://sgmmeibexipozsywxpyk.supabase.co/storage/v1/object/public/agenda-images/yh_namu.png"></div>
    <div class="login-title">SYMPO<span>VOY</span></div>
    <p class="login-sub">심포지엄 도장깨기</p>
    <input class="login-input" id="lName" placeholder="이름">
    <input class="login-input" id="lHospital" placeholder="병원명">
    <input class="login-input" id="lLicense" placeholder="면허번호">
    <input class="login-input" id="lMrEmpId" placeholder="MR 사번 (8자리 숫자)" maxlength="8" inputmode="numeric">
    <button class="login-btn" onclick="doLogin()">승인 요청하기</button>
    <p class="login-hint">담당 MR에게 사번을 확인하세요<br>MR 승인 후 서비스 이용이 가능합니다</p>
  </div>
</div>

<!-- 대기 -->
<div class="pending-wrap" id="pendingWrap">
  <div class="pending-icon">⏳</div>
  <div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:8px">승인 대기 중</div>
  <div style="font-size:13px;color:rgba(255,255,255,.5);margin-bottom:20px;line-height:1.7">담당 MR의 승인을 기다리고 있습니다<br>승인 후 자동으로 접속됩니다</div>
  <div class="pending-info" id="pendingInfo"></div>
  <button style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 22px;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;font-family:inherit" onclick="doLogout()">다시 입력하기</button>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-logo">
      <img src="https://sgmmeibexipozsywxpyk.supabase.co/storage/v1/object/public/agenda-images/yh_namu.png">
      <span>SYMPO<em>VOY</em></span>
    </div>
    <div class="topbar-r">
      <button class="t-btn" onclick="toggleTheme()">🌙 다크</button>
      <span class="topbar-user" id="topUser"></span>
      <button class="t-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="content">
    <!-- 초대장 -->
    <div class="page active" id="page-invite">
      <div id="inviteListView">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 14px 4px">
          <div style="font-size:16px;font-weight:800">📨 내 초대장</div>
          <button onclick="loadAllInvites()" class="t-btn">🔄 새로고침</button>
        </div>
        <div class="invite-grid" id="inviteGrid">
          <div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted)">
            <div style="font-size:36px;margin-bottom:10px">🔗</div>
            <div style="font-size:14px;font-weight:700;margin-bottom:5px">초대장 없음</div>
            <div style="font-size:12px">담당 MR이 초대장을 준비 중입니다</div>
          </div>
        </div>
      </div>
      <div id="inviteDetailView" style="display:none">
        <div class="back-btn" onclick="showInviteList()">← 초대장 목록</div>
        <div id="inviteDetailContent"></div>
      </div>
    </div>

    <!-- 도장판 -->
    <div class="page" id="page-stamp">
      <div class="score-hero">
        <div class="score-num" id="totalScore">0</div>
        <div style="font-size:12px;opacity:.8;margin-top:3px">누적 점수</div>
        <div class="score-bd">
          <div class="score-bd-item"><div class="score-bd-num" id="gpsTotal">0</div><div class="score-bd-label">방문인증</div></div>
          <div class="score-bd-item"><div class="score-bd-num" id="photoTotal">0</div><div class="score-bd-label">사진</div></div>
          <div class="score-bd-item"><div class="score-bd-num" id="itemTotal">0</div><div class="score-bd-label">품목</div></div>
        </div>
      </div>
      <div class="month-filter" id="stampMonthFilter"></div>
      <div style="font-size:13px;font-weight:800;padding:12px 14px 6px">🏅 방문 도장</div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>
  </div>

  <div class="btab">
    <div class="btab-item active" onclick="switchTab(this,'invite')"><span class="btab-icon">📨</span>초대장</div>
    <div class="btab-item" onclick="switchTab(this,'stamp')"><span class="btab-icon">🏅</span>도장판</div>
  </div>
</div>

<!-- GPS 스핀 -->
<div class="gps-overlay" id="gpsOverlay">
  <div class="gps-card">
    <div class="gps-hotel-name" id="gpsHotelName">🏨 호텔 도착!</div>
    <div class="gps-sub">로고를 손가락으로 좌우로 쓸어서 방문을 인증하세요</div>
    <div class="spin-area">
      <div class="spin-ring"></div>
      <div class="spin-img" id="spinTarget">
        <img src="https://sgmmeibexipozsywxpyk.supabase.co/storage/v1/object/public/agenda-images/yh_namu.png">
      </div>
    </div>
    <div class="spin-hint">👉 손가락으로 좌우 슬라이드 하세요!</div>
    <div class="spin-progress"><div class="spin-bar" id="spinBar"></div></div>
    <button class="gps-cancel" onclick="cancelSpin()">나중에 하기</button>
  </div>
</div>

<!-- 완료 -->
<div class="done-overlay" id="doneOverlay">
  <div class="done-card">
    <div class="done-anim">✅</div>
    <div style="font-size:24px;font-weight:900;margin-bottom:6px">방문 인증 완료!</div>
    <div style="font-size:13px;opacity:.7;margin-bottom:5px" id="doneHotelName"></div>
    <div style="font-size:42px;font-weight:900;color:#4f8ef7;margin-bottom:3px">+10점</div>
    <div style="font-size:12px;opacity:.6;margin-bottom:22px">방문 인증 점수 적립!</div>
    <button class="done-btn" onclick="afterComplete()">📸 사진 업로드 (+5점)</button><br>
    <button class="done-skip" onclick="skipPhoto()">건너뛰기</button>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(this)">

<script>
const SB_URL='https://sgmmeibexipozsywxpyk.supabase.co';
const SB_KEY='sb_publishable_rWGxXiyqq493Vu6cqNyfCA_8DfSMqqQ';
const sb=supabase.createClient(SB_URL,SB_KEY);
const NAMU_URL='https://sgmmeibexipozsywxpyk.supabase.co/storage/v1/object/public/agenda-images/yh_namu.png';

let currentUser=null;
let currentJourney=null;
let allInvites=[];
let currentVisitId=null;
let spinActive=false;
let spinRotation=0;
let totalSpinAngle=0;
let lastAngle=0;
let _allVisits=[];
let spinStarted=false;

// 로그인
async function doLogin(){
  const name=document.getElementById('lName').value.trim();
  const hospital=document.getElementById('lHospital').value.trim();
  const license=document.getElementById('lLicense').value.trim();
  const mrEmpId=document.getElementById('lMrEmpId').value.trim();
  if(!name||!hospital||!license||!mrEmpId){toast('모두 입력해주세요');return;}
  let {data:user}=await sb.from('users').select('*').eq('license_number',license).eq('name',name).single();
  if(user){
    if(user.mr_approval==='approved'){currentUser=user;localStorage.setItem('user_session',JSON.stringify(user));enterApp();return;}
    const {data:mr}=await sb.from('introducers').select('*').eq('id',user.introducer_id).single();
    showPending(user,mr);return;
  }
  const {data:mr}=await sb.from('introducers').select('*').eq('employee_id',mrEmpId).single();
  if(!mr){toast('존재하지 않는 MR 사번입니다');return;}
  const {data:nu,error}=await sb.from('users').insert({name,hospital,license_number:license,introducer_id:mr.id,mr_approval:'pending',is_approved:false}).select().single();
  if(error||!nu){toast('오류: '+(error?.message||'등록 실패'));return;}
  localStorage.setItem('user_session',JSON.stringify(nu));
  showPending(nu,mr);
}

function showPending(user,mr){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('pendingWrap').style.display='flex';
  document.getElementById('pendingInfo').innerHTML=`
    <div class="p-row"><span class="p-label">이름</span><span class="p-val">${user.name}</span></div>
    <div class="p-row"><span class="p-label">병원</span><span class="p-val">${user.hospital}</span></div>
    <div class="p-row"><span class="p-label">담당 MR</span><span class="p-val">${mr?mr.name:'-'}</span></div>`;
  const iv=setInterval(async()=>{
    const {data}=await sb.from('users').select('mr_approval').eq('id',user.id).single();
    if(data?.mr_approval==='approved'){clearInterval(iv);currentUser={...user,mr_approval:'approved'};localStorage.setItem('user_session',JSON.stringify(currentUser));toast('승인되었습니다! 🎉');setTimeout(enterApp,1200);}
  },30000);
}

function enterApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('pendingWrap').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('topUser').textContent=currentUser.name;
  loadAllInvites();
  loadStamp();
  startGPSWatch();
}

window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('user_session');if(!saved)return;
  const u=JSON.parse(saved);
  const {data}=await sb.from('users').select('*').eq('id',u.id).single();
  if(!data){localStorage.removeItem('user_session');return;}
  if(data.mr_approval==='approved'){currentUser=data;enterApp();}
  else{const {data:mr}=await sb.from('introducers').select('*').eq('id',data.introducer_id).single();showPending(data,mr);}
});

// ===== 초대장 =====
async function loadAllInvites(){
  if(!currentUser)return;
  const {data:pkgs}=await sb.from('invite_packages').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:true});
  const grid=document.getElementById('inviteGrid');
  if(!pkgs||!pkgs.length){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:36px;margin-bottom:10px">🔗</div><div style="font-size:14px;font-weight:700;margin-bottom:5px">초대장 없음</div><div style="font-size:12px">담당 MR이 준비 중입니다</div></div>`;
    return;
  }
  allInvites=pkgs;
  const lastCount=parseInt(localStorage.getItem('last_invite_count')||'0');
  if(pkgs.length>lastCount&&lastCount>0)toast('📨 새 초대장이 도착했습니다!');
  localStorage.setItem('last_invite_count',pkgs.length);

  const jIds=[...new Set(pkgs.map(p=>p.journey_id))];
  const {data:journeys}=await sb.from('journeys').select('*').in('id',jIds);
  const jMap={};(journeys||[]).forEach(j=>jMap[j.id]=j);
  const today=new Date().toISOString().slice(0,10);
  const barColors=['#3b6ef5','#c17f24','#4f8ef7'];

  grid.innerHTML=pkgs.map((p,i)=>{
    const j=jMap[p.journey_id]||{};
    const endDate=j.symposium_date_end||j.symposium_date||'';
    const isPast=endDate&&endDate<today;
    const isUpcoming=j.symposium_date&&j.symposium_date>=today;
    const period=j.symposium_date?(j.symposium_date+(j.symposium_date_end?' ~\n'+j.symposium_date_end:'')):'-';
    const badge=isPast?'<span class="ig-badge-past">지난 일정</span>':isUpcoming?'<span class="ig-badge-new">예정</span>':'';
    return `<div class="ig-card ${isPast?'past':isUpcoming?'upcoming':''}" onclick="showInviteDetail(${i})">
      <div class="ig-bar" style="background:${barColors[(p.concept-1)%3]||'#3b6ef5'}"></div>
      ${badge}
      <div class="ig-num" style="margin-top:4px">초대장 ${i+1}</div>
      <div class="ig-hotel">🏨 ${j.hotel_name||'-'}</div>
      <div class="ig-date">📅 ${period}</div>
      ${j.symposium_name?`<div class="ig-sympo">🎓 ${j.symposium_name}</div>`:''}
    </div>`;
  }).join('');
}

function copyAddr(addr){
  navigator.clipboard.writeText(addr).then(()=>toast('📋 주소 복사됨! 네비에 붙여넣기 하세요',3000)).catch(()=>{
    const el=document.createElement('textarea');el.value=addr;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);toast('📋 주소 복사됨!');
  });
}

function addInlineItem(){
  const div=document.createElement('div');div.className='item-row';
  div.innerHTML='<span>💊</span><input placeholder="품목명 입력" type="text"><button class="item-del" onclick="this.parentNode.remove()">×</button>';
  document.getElementById('inlineItemList').appendChild(div);

async function submitInlineItems(journeyId){
  const inputs=document.querySelectorAll('#inlineItemList .item-row input');
  const items=[...inputs].map(i=>i.value.trim()).filter(Boolean);
  if(!items.length){toast('품목을 입력해주세요');return;}
  await Promise.all(items.map(name=>sb.from('items').insert({user_id:currentUser.id,journey_id:journeyId,item_name:name})));
  toast('품목 전송 완료! MR과 관리자에게 전달됩니다 ✅');
  document.getElementById('inlineItemList').innerHTML='';
  // 이력 새로고침
  const {data:myItems}=await sb.from('items').select('*').eq('user_id',currentUser.id).eq('journey_id',journeyId).order('submitted_at',{ascending:false});
  const el=document.querySelector('#inviteDetailContent .card:last-child div[style*="제출 이력"]')?.nextElementSibling;
  if(el&&myItems){el.innerHTML=myItems.map(i=>`<div class="item-history-row"><div><div style="font-size:13px;font-weight:700">${i.item_name}</div><div style="font-size:11px;color:var(--muted)">${new Date(i.submitted_at).toLocaleDateString('ko-KR')}</div></div><span class="badge badge-blue">검토중</span></div>`).join('');}
  loadStamp();
}

// ===== GPS =====
function activateGPS(){
  if(!currentJourney?.hotel_lat||!currentJourney?.hotel_lng){toast('이 호텔은 GPS 정보가 없습니다');return;}
  if(!navigator.geolocation){toast('GPS를 지원하지 않는 기기입니다');return;}
  toast('📍 GPS 위치 확인 중...');
  navigator.geolocation.getCurrentPosition(pos=>{
    const dist=getDistance(pos.coords.latitude,pos.coords.longitude,currentJourney.hotel_lat,currentJourney.hotel_lng);
    if(dist<=300){checkAlreadyVisited();}
    else{toast(`호텔까지 ${Math.round(dist)}m — 300m 이내에서 인증 가능합니다`,3500);}
  },{enableHighAccuracy:true,timeout:12000},()=>toast('GPS 오류: 위치 권한을 허용해주세요'));
}

function startGPSWatch(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(pos=>{
    if(!currentJourney?.hotel_lat||spinActive)return;
    const dist=getDistance(pos.coords.latitude,pos.coords.longitude,currentJourney.hotel_lat,currentJourney.hotel_lng);
    if(dist<=300)checkAlreadyVisited();
  },{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

async function checkAlreadyVisited(){
  if(!currentUser||!currentJourney)return;
  const {data}=await sb.from('visits').select('id').eq('user_id',currentUser.id).eq('journey_id',currentJourney.id).single();
  if(data){toast('이미 방문 인증이 완료된 곳입니다 ✅');return;}
  showSpinOverlay();
}

function getDistance(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function showSpinOverlay(){
  spinActive=true;totalSpinAngle=0;spinRotation=0;spinStarted=false;
  document.getElementById('gpsHotelName').textContent='🏨 '+currentJourney.hotel_name+' 도착!';
  document.getElementById('spinBar').style.width='0%';
  document.getElementById('gpsOverlay').classList.add('show');
  const el=document.getElementById('spinTarget');
  el.style.transition='none';
  el.style.transform='translate(-50%,-50%) rotate(0deg)';

  let startX=0;
  let lastX=0;
  const REQUIRED=600; // 총 슬라이드 누적 거리(px)

  function onStart(e){
    e.preventDefault();
    const t=e.touches?e.touches[0]:e;
    startX=t.clientX;lastX=t.clientX;
    spinStarted=true;
  }
  function onMove(e){
    e.preventDefault();
    if(!spinStarted||!spinActive)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-lastX;
    lastX=t.clientX;
    // 슬라이드 방향에 따라 회전 (좌→우: +회전, 우→좌: -회전)
    const rotDelta=dx*2.5; // 슬라이드 1px당 회전각도
    spinRotation+=rotDelta;
    totalSpinAngle+=Math.abs(dx);
    el.style.transform=`translate(-50%,-50%) rotate(${spinRotation}deg)`;
    document.getElementById('spinBar').style.width=Math.min(totalSpinAngle/REQUIRED*100,100)+'%';
    if(totalSpinAngle>=REQUIRED&&spinActive)completeVisit();
  }
  function onEnd(){spinStarted=false;}

  // 기존 리스너 제거 후 재등록
  const newEl=el.cloneNode(true);el.parentNode.replaceChild(newEl,el);
  newEl.addEventListener('touchstart',onStart,{passive:false});
  newEl.addEventListener('touchmove',onMove,{passive:false});
  newEl.addEventListener('touchend',onEnd,{passive:true});
  newEl.addEventListener('mousedown',onStart);
  document.addEventListener('mousemove',e=>{if(spinStarted)onMove(e);});
  document.addEventListener('mouseup',onEnd);
}

function cancelSpin(){spinActive=false;spinStarted=false;document.getElementById('gpsOverlay').classList.remove('show');}

async function completeVisit(){
  if(!spinActive)return;spinActive=false;spinStarted=false;
  document.getElementById('gpsOverlay').classList.remove('show');
  const {data}=await sb.from('visits').insert({user_id:currentUser.id,journey_id:currentJourney.id,gps_score:10,photo_score:0,item_score:0}).select().single();
  if(data){currentVisitId=data.id;await sb.from('symposium_history').insert({user_id:currentUser.id,journey_id:currentJourney.id});}
  document.getElementById('doneHotelName').textContent=currentJourney.hotel_name;
  document.getElementById('doneOverlay').classList.add('show');
  // 폭죽 효과
  launchConfetti();
  loadStamp();
}

  const overlay=document.getElementById('doneOverlay');

      el.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};z-index:700;pointer-events:none;animation:fall ${1.5+Math.random()*2}s ease-in forwards;`;

      setTimeout(()=>el.remove(),4000);

async function uploadPhoto(input){
  const file=input.files[0];if(!file||!currentVisitId)return;
  toast('사진 업로드 중...');
  const path=`visit_${currentVisitId}_${Date.now()}.jpg`;
  const {error}=await sb.storage.from('agenda-images').upload(path,file,{upsert:true});
  if(error){toast('업로드 실패');return;}
  const {data:{publicUrl}}=sb.storage.from('agenda-images').getPublicUrl(path);
  await sb.from('visits').update({photo_url:publicUrl,photo_score:5}).eq('id',currentVisitId);
  toast('사진 업로드 완료! +5점 🎉');loadStamp();
}

// ===== 도장판 =====
async function loadStamp(){
  if(!currentUser)return;
  const {data:visits}=await sb.from('visits').select('*,journeys(hotel_name,symposium_date)').eq('user_id',currentUser.id);
  if(!visits)return;
  _allVisits=visits;
  const gps=visits.reduce((s,v)=>s+(v.gps_score||0),0);
  const photo=visits.reduce((s,v)=>s+(v.photo_score||0),0);
  const item=visits.reduce((s,v)=>s+(v.item_score||0),0);
  document.getElementById('totalScore').textContent=gps+photo+item;
  document.getElementById('gpsTotal').textContent=gps;
  document.getElementById('photoTotal').textContent=photo;
  document.getElementById('itemTotal').textContent=item;
  const months=new Set();
  visits.forEach(v=>{const d=v.journeys?.symposium_date||v.visited_at||'';if(d.length>=7)months.add(d.slice(0,7));});
  const sorted=[...months].sort().reverse();
  const el=document.getElementById('stampMonthFilter');
  if(sorted.length){
    let h='<span class="month-chip active" data-month="all" onclick="filterStamp(this.dataset.month)">전체</span>';
    sorted.forEach(m=>{const p=m.split('-');h+=`<span class="month-chip" data-month="${m}" onclick="filterStamp(this.dataset.month)">${p[0]}년 ${parseInt(p[1])}월</span>`;});
    el.innerHTML=h;
  }
  renderStampGrid(visits);
}

function filterStamp(m){
  document.querySelectorAll('#stampMonthFilter .month-chip').forEach(c=>c.classList.toggle('active',c.dataset.month===m));
  const f=m==='all'?_allVisits:_allVisits.filter(v=>(v.journeys?.symposium_date||v.visited_at||'').startsWith(m));
  renderStampGrid(f);
}

function renderStampGrid(visits){
  document.getElementById('stampGrid').innerHTML=visits.length?visits.map(v=>`
    <div class="stamp-item done">
      <div class="stamp-icon"><img src="${NAMU_URL}"></div>
      <div class="stamp-name">${(v.journeys?.hotel_name||'').slice(0,6)}</div>
      <div style="font-size:10px;color:var(--green);margin-top:2px">${(v.gps_score||0)+(v.photo_score||0)+(v.item_score||0)}점</div>
    </div>`).join(''):'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;grid-column:1/-1">방문 기록 없음</div>';
}
</script>
</body>
</html>
