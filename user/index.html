<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SYMPOVOY 사용자</title>
<meta name="app-build" content="2026-08-12-d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f8;--accent:#3b6ef5;--green:#18b96a;--red:#e74c3c;--yellow:#f59e0b;--text:#1a1d2e;--muted:#7b82a0;--border:#e2e5f0;--radius:16px;}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--accent:#4f8ef7;--green:#2ecc71;--red:#e74c3c;--yellow:#f39c12;--text:#e8eaf0;--muted:#8890a8;--border:#2a2f45;}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo',sans-serif;min-height:100vh;}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:36px 24px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:10px;}
.login-logo img{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.2);}
.login-title{font-size:22px;font-weight:900;color:#fff;text-align:center;margin-bottom:4px;}
.login-title span{color:#4f8ef7;}
.login-sub{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:24px;text-align:center;}
.login-input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 15px;color:#fff;font-size:15px;outline:none;margin-bottom:10px;font-family:inherit;}
.login-input::placeholder{color:rgba(255,255,255,.35);}
.login-input:focus{border-color:#4f8ef7;}
.login-btn{width:100%;background:#4f8ef7;border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;}
.login-hint{font-size:11px;color:rgba(255,255,255,.4);text-align:center;margin-top:12px;line-height:1.6;}

.pending-wrap{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);flex-direction:column;text-align:center;}
.pend-icon{font-size:60px;margin-bottom:14px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.pend-info{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 18px;margin-bottom:18px;width:100%;max-width:320px;text-align:left;}
.pend-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;}
.pend-row:last-child{border-bottom:none;}

.app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tl{display:flex;align-items:center;gap:7px;}
.tl img{width:26px;height:26px;border-radius:50%;}
.tl span{font-size:16px;font-weight:900;}
.tl em{color:var(--accent);font-style:normal;}
.tr{display:flex;align-items:center;gap:5px;}
.tbtn{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:4px 10px;font-size:11px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
.tuser{font-size:11px;color:var(--muted);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.btab{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.bti{display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;}
.bti.active{color:var(--accent);}
.bti-icon{font-size:22px;margin-bottom:2px;}
.content{padding:0 0 80px;}
.page{display:none;}
.page.active{display:block;}

/* 초대장 그리드 */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px;}
.icard{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden;}
.icard.past{opacity:.5;filter:grayscale(.5);}
.icard.upcoming{border-color:var(--accent);box-shadow:0 4px 14px rgba(59,110,245,.15);}
.icard-bar{position:absolute;top:0;left:0;right:0;height:4px;}
.icard-num{font-size:10px;color:var(--muted);font-weight:700;margin-top:3px;margin-bottom:5px;}
.icard-hotel{font-size:13px;font-weight:800;line-height:1.3;margin-bottom:3px;}
.icard-date{font-size:10px;color:var(--muted);}
.icard-sympo{font-size:10px;color:var(--accent);margin-top:3px;}
.badge-new{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border-radius:8px;padding:2px 6px;font-size:9px;font-weight:700;}
.badge-past{position:absolute;top:8px;right:8px;background:var(--muted);color:#fff;border-radius:8px;padding:2px 6px;font-size:9px;font-weight:700;}

/* 초대장 상세 */
.back-btn{display:flex;align-items:center;gap:7px;padding:12px 14px;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;border-bottom:1px solid var(--border);background:var(--surface);}
.hotel-hero{border-radius:var(--radius);padding:22px 18px;margin:12px 14px;position:relative;overflow:hidden;}
.hotel-hero.c1{background:linear-gradient(135deg,#1a1d2e,#2d3561);color:#fff;}
.hotel-hero.c2{background:linear-gradient(135deg,#6b3a1f,#c17f24);color:#fff;}
.hotel-hero.c3{background:linear-gradient(135deg,#1a3a6e,#3b6ef5);color:#fff;}
.hotel-hero.past{background:linear-gradient(135deg,#444,#666);color:#fff;}
.gps-hint-btn{display:block;width:100%;margin-top:14px;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;backdrop-filter:blur(3px);transition:background .18s;}
.gps-hint-btn:hover{background:rgba(255,255,255,.32);}
.gps-hint-btn:active{transform:scale(.98);}
.hotel-name{font-size:20px;font-weight:900;margin-bottom:4px;}
.hotel-date{font-size:12px;opacity:.75;margin-bottom:5px;}

.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:15px;margin:10px 14px;}
.sec-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.agenda-img{width:100%;max-height:500px;object-fit:contain;border-radius:10px;margin-top:8px;display:block;}

/* 추천 장소 */
/* 타입별 색 — 라이트/다크에서 각각 대비가 확보되도록 CSS 변수로 분리 */
.pt-restaurant{--pc:#1a7a4e;}
.pt-cafe{--pc:#c98400;}
.pt-attraction{--pc:#2d6a8a;}
.pt-shopping{--pc:#e91e8c;}
.pt-default{--pc:#5a6178;}
:root[data-theme="dark"] .pt-restaurant{--pc:#3ddc97;}
:root[data-theme="dark"] .pt-cafe{--pc:#f5c451;}
:root[data-theme="dark"] .pt-attraction{--pc:#5aa8ce;}
:root[data-theme="dark"] .pt-shopping{--pc:#ff5fb0;}
:root[data-theme="dark"] .pt-default{--pc:#9aa2bb;}

.place-card{border-radius:14px;padding:16px;margin-bottom:12px;border:3px solid var(--pc);}
.place-card .place-type-label{color:var(--pc);}
.place-card .place-addr-copy{color:var(--pc);}
.place-card .pbtn-copy{border-color:var(--pc);}
.place-photo-wrap{position:relative;width:100%;height:160px;border-radius:11px;overflow:hidden;margin-bottom:12px;background:var(--surface2);}
.place-photo{width:100%;height:100%;object-fit:cover;display:block;}
.place-photo-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;line-height:1;text-shadow:0 4px 14px rgba(0,0,0,.25);}
.place-type-label{font-size:11px;font-weight:700;margin-bottom:5px;}
.place-name-big{font-size:18px;font-weight:900;color:var(--text);margin-bottom:7px;}
.place-addr-row{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer;}
.place-addr-text{flex:1;font-size:12px;color:var(--muted);line-height:1.4;}
.place-addr-copy{font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.place-tip{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:8px;}
.place-btns{display:flex;gap:6px;flex-wrap:wrap;}
.pbtn{padding:7px 12px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.pbtn-naver{background:#03c75a;color:#fff;}
.pbtn-nav{background:var(--accent);color:#fff;}
.pbtn-copy{background:var(--surface2);color:var(--text);border:1.5px solid var(--border);}

/* 품목 */
.item-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.item-row input{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit;}
.item-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;}
.add-item-btn{width:100%;background:var(--surface2);border:1.5px dashed var(--border);border-radius:10px;padding:11px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:10px;}
.send-btn{width:100%;background:var(--accent);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;}
.irow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.irow:last-child{border-bottom:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:rgba(24,185,106,.12);color:var(--green);}
.badge-blue{background:rgba(59,110,245,.12);color:var(--accent);}

/* 도장판 */
.score-hero{background:linear-gradient(135deg,var(--accent),#6c47d4);border-radius:var(--radius);padding:20px;text-align:center;color:#fff;margin:12px 14px;}
.score-num{font-size:50px;font-weight:900;line-height:1;}
.score-bd{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px;}
.score-bd-item{background:rgba(255,255,255,.15);border-radius:10px;padding:9px 5px;text-align:center;}
.score-bd-num{font-size:18px;font-weight:800;}
.score-bd-label{font-size:10px;opacity:.8;margin-top:1px;}
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 14px 14px;}
.stamp-item{background:var(--surface2);border-radius:12px;padding:12px 6px;text-align:center;border:2px solid transparent;}
.stamp-item.done{background:rgba(24,185,106,.08);border-color:var(--green);}
.stamp-img{width:32px;height:32px;border-radius:50%;margin-bottom:4px;}
.stamp-name{font-size:11px;font-weight:800;color:var(--muted);line-height:1.25;word-break:keep-all;}
.stamp-date{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:-.2px;white-space:nowrap;}
.stamp-item.done .stamp-date{color:var(--green);opacity:.85;}
.stamp-score{font-size:10px;font-weight:700;color:var(--green);margin-top:3px;}
.stamp-item.done .stamp-name{color:var(--green);}
.mf{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px 0;}
.mc{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:var(--surface2);}
.mc.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* GPS 스핀 오버레이 */
.gps-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;flex-direction:column;align-items:center;justify-content:center;}
.gps-overlay.show{display:flex;}
.gps-card{background:#fff;border-radius:28px;padding:32px 24px;text-align:center;width:88%;max-width:320px;}
.gps-hotel{font-size:15px;font-weight:800;color:#1a1d2e;margin-bottom:3px;}
.gps-sub{font-size:12px;color:#7b82a0;margin-bottom:22px;line-height:1.5;}
.spin-wrap{position:relative;width:180px;height:180px;margin:0 auto 18px;}
.spin-ring{position:absolute;inset:0;border-radius:50%;border:3px dashed #e2e5f0;animation:spinRing 3s linear infinite;}
@keyframes spinRing{to{transform:rotate(360deg);}}
.spin-logo{position:absolute;top:50%;left:50%;width:130px;height:130px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 32px rgba(0,0,0,.2);transform:translate(-50%,-50%);background:#f5f6fa;touch-action:none;}
.spin-logo img{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;}
.spin-hint{font-size:12px;color:#7b82a0;margin-bottom:12px;}
.spin-progress{width:100%;height:8px;background:#f0f2f8;border-radius:4px;overflow:hidden;}
.spin-bar{height:100%;background:linear-gradient(90deg,#3b6ef5,#6c47d4);border-radius:4px;width:0%;transition:width .05s;}

/* ===== 도장 꽝 애니메이션 ===== */
.stamp-slam{position:absolute;top:50%;left:50%;width:152px;height:152px;z-index:5;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-45deg);}
.stamp-slam.slam{animation:slamIn .62s cubic-bezier(.2,.85,.3,1.15) forwards;}
@keyframes slamIn{
  0%{transform:translate(-50%,-50%) scale(3.2) rotate(-45deg);opacity:0;}
  45%{opacity:1;}
  62%{transform:translate(-50%,-50%) scale(.86) rotate(-8deg);opacity:1;}
  78%{transform:translate(-50%,-50%) scale(1.08) rotate(-15deg);}
  100%{transform:translate(-50%,-50%) scale(1) rotate(-12deg);opacity:1;}
}
.stamp-ink{width:100%;height:100%;border-radius:50%;border:6px solid #d8232a;box-shadow:inset 0 0 0 3px #d8232a;background:rgba(216,35,42,.07);color:#d8232a;display:flex;flex-direction:column;align-items:center;justify-content:center;mix-blend-mode:multiply;}
.stamp-word{font-size:54px;font-weight:900;line-height:1;letter-spacing:-3px;}
.stamp-sub{font-size:12px;font-weight:800;letter-spacing:5px;margin-top:2px;padding-left:5px;}

@keyframes cardShake{0%,100%{transform:translate(0,0);}18%{transform:translate(-7px,4px);}36%{transform:translate(6px,-4px);}54%{transform:translate(-5px,3px);}72%{transform:translate(4px,-2px);}88%{transform:translate(-2px,1px);}}
.gps-card.shake{animation:cardShake .42s ease-out;}
/* 도장이 찍히는 동안 안내 요소는 페이드아웃 */
.gps-card.stamped .gps-sub,
.gps-card.stamped .spin-hint,
.gps-card.stamped .spin-progress,
.gps-card.stamped .gps-cancel,
.gps-card.stamped .spin-ring{opacity:0;transition:opacity .3s;}
.gps-cancel{margin-top:14px;background:none;border:none;color:#7b82a0;font-size:13px;cursor:pointer;font-family:inherit;}

/* 완료 오버레이 */
.done-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:600;flex-direction:column;align-items:center;justify-content:center;}
.done-overlay.show{display:flex;}
.done-card{text-align:center;color:#fff;padding:36px 24px;}
.done-anim{font-size:80px;margin-bottom:14px;animation:popIn .5s cubic-bezier(.68,-.55,.27,1.55);}
@keyframes popIn{0%{transform:scale(0);}100%{transform:scale(1);}}
.done-btn{background:#fff;color:#1a1d2e;border:none;border-radius:14px;padding:13px 36px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;display:block;width:100%;}
.done-skip{background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px;}

/* 폭죽 */
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(40px);background:#1a1d2e;color:#fff;padding:11px 20px;border-radius:40px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ===================================================================
   PC 대응 — 모바일 구성을 그대로 유지한 채 화면 중앙에 폰 프레임으로 표시
   =================================================================== */
@media (min-width:600px){
  /* html에 배경을 주어야 body 배경이 캔버스 전체로 번지지 않음 */
  html{background:#0b0e18;}
  html[data-theme="dark"]{background:#05070d;}

  body{
    width:430px;
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 70px rgba(0,0,0,.55);
    position:relative;
  }

  /* 하단 탭바 — 뷰포트 전체가 아니라 프레임 폭에 맞춤 */
  .btab{
    left:50%;
    right:auto;
    width:430px;
    transform:translateX(-50%);
  }

  /* 오버레이 — 프레임 안쪽만 덮도록 */
  .gps-overlay,.done-overlay{
    left:50%;
    right:auto;
    width:430px;
    transform:translateX(-50%);
  }

  /* PC 마우스 인터랙션 보강 */
  .icard{transition:border-color .2s,transform .15s,box-shadow .2s;}
  .icard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.14);}
  .tbtn:hover,.pbtn:hover,.mc:hover{filter:brightness(1.08);}
  .login-btn:hover,.send-btn:hover,.done-btn:hover{filter:brightness(1.08);}
  .bti:hover{color:var(--accent);}
  .place-addr-row:hover{filter:brightness(.97);}

  /* 스크롤바를 프레임에 어울리게 */
  body::-webkit-scrollbar{width:8px;}
  body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
}

/* 넓은 화면에서 프레임 좌우 여백을 살짝 더 어둡게 */
@media (min-width:1000px){
  html{background:radial-gradient(circle at 50% 0%,#161b2e 0%,#0b0e18 60%);background-attachment:fixed;}
  html[data-theme="dark"]{background:radial-gradient(circle at 50% 0%,#0d1120 0%,#05070d 60%);background-attachment:fixed;}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo"><img src="https://sgmmeibexipozsywxpyk.supabase.co/storage/v1/object/public/agenda-images/yh_namu.png"></div>
    <div class="login-title">SYMPO<span>VOY</span></div>
    <p class="login-sub">심포지엄 도장깨기</p>
    <input class="login-input" id="lName" placeholder="이름">
    <input class="login-input" id="lHospital" placeholder="병원명">
    <input class="login-input" id="lLicense" placeholder="면허번호">
    <input class="login-input" id="lMrEmpId" placeholder="MR 사번 (8자리 숫자)" maxlength="8" inputmode="numeric">
    <button class="login-btn" onclick="doLogin()">승인 요청하기</button>
    <p class="login-hint">담당 MR에게 사번을 확인하세요<br>MR 승인 후 서비스 이용이 가능합니다</p>
  </div>
</div>

<!-- 대기 -->
<div class="pending-wrap" id="pendingWrap">
  <div class="pend-icon">⏳</div>
  <div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:8px">승인 대기 중</div>
  <div style="font-size:13px;color:rgba(255,255,255,.5);margin-bottom:18px;line-height:1.7">담당 MR의 승인을 기다리고 있습니다</div>
  <div class="pend-info" id="pendInfo"></div>
  <button onclick="doLogout()" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 22px;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;font-family:inherit">다시 입력하기</button>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="topbar">

async function doLogin(){
  const name=document.getElementById('lName').value.trim();
  const hosp=document.getElementById('lHospital').value.trim();
  const lic=document.getElementById('lLicense').value.trim();
  const emp=document.getElementById('lMrEmpId').value.trim();
  if(!name||!hosp||!lic||!emp){toast('모두 입력해주세요');return;}
  // 기존 사용자 확인
  let {data:u}=await sb.from('users').select('*').eq('license_number',lic).eq('name',name).single();
  if(u){
    if(u.mr_approval==='approved'){CU=u;localStorage.setItem('sv_session',JSON.stringify(u));enterApp();return;}
    const {data:mr}=await sb.from('introducers').select('*').eq('id',u.introducer_id).single();
    showPend(u,mr);return;
  }
  // MR 확인
  const {data:mr}=await sb.from('introducers').select('*').eq('employee_id',emp).single();
  if(!mr){toast('존재하지 않는 MR 사번입니다');return;}
  const {data:nu,error}=await sb.from('users').insert({name,hospital:hosp,license_number:lic,introducer_id:mr.id,mr_approval:'pending',is_approved:false}).select().single();
  if(error||!nu){toast('오류: '+(error?.message||'등록 실패'));return;}
  localStorage.setItem('sv_session',JSON.stringify(nu));
  showPend(nu,mr);
}

async function loadAllInvites(){
  if(!CU)return;
  const {data:pkgs}=await sb.from('invite_packages').select('*').eq('user_id',CU.id).order('created_at',{ascending:true});
  const grid=document.getElementById('inviteGrid');
  if(!pkgs||!pkgs.length){
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:36px;margin-bottom:10px">🔗</div><div style="font-size:14px;font-weight:700;margin-bottom:5px">초대장 없음</div><div style="font-size:12px">담당 MR이 준비 중입니다</div></div>`;
    return;
  }
  allInvites=pkgs;
  const cnt=parseInt(localStorage.getItem('sv_inv_cnt')||'0');
  if(pkgs.length>cnt&&cnt>0)toast('📨 새 초대장이 도착했습니다!');
  localStorage.setItem('sv_inv_cnt',pkgs.length);

  const jIds=[...new Set(pkgs.map(p=>p.journey_id))];
  const {data:journeys}=await sb.from('journeys').select('*').in('id',jIds);
  const jMap={};(journeys||[]).forEach(j=>jMap[j.id]=j);
  const today=new Date().toISOString().slice(0,10);
  const bColors=['#3b6ef5','#c17f24','#4f8ef7'];

  grid.innerHTML=pkgs.map((p,i)=>{
    const j=jMap[p.journey_id]||{};
    const end=j.symposium_date_end||j.symposium_date||'';
    const isPast=end&&end<today;
    const isUp=j.symposium_date&&j.symposium_date>=today;
    const period=j.symposium_date?(j.symposium_date+(j.symposium_date_end?'\n~'+j.symposium_date_end:'')):'-';
    const badge=isPast?`<span class="badge-past">지난 일정</span>`:isUp?`<span class="badge-new">예정</span>`:'';
    return `<div class="icard ${isPast?'past':isUp?'upcoming':''}" onclick="showDetail(${i})">
      <div class="icard-bar" style="background:${bColors[(p.concept-1)%3]||'#3b6ef5'}"></div>
      ${badge}
      <div class="icard-num">초대장 ${i+1}</div>
      <div class="icard-hotel">🏨 ${j.hotel_name||'-'}</div>
      <div class="icard-date">📅 ${period}</div>
      ${j.symposium_name?`<div class="icard-sympo">🎓 ${j.symposium_name}</div>`:''}
    </div>`;
  }).join('');
}

}

  // 추천 장소 로드 - invite_id로 정확히 조회

  // 방문 여부

  // 아젠다 HTML

      isPdf
        ?`<div style="background:var(--surface2);border-radius:10px;padding:18px;text-align:center"><div style="font-size:32px;margin-bottom:8px">📄</div><div style="font-size:13px;font-weight:700;margin-bottom:10px">PDF 아젠다</div><button onclick="window.open('${J.agenda_image_url}','_blank')" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer">PDF 열기 →</button></div>`
        :`<img src="${J.agenda_image_url}" class="agenda-img" onerror="this.style.display='none'">`

  }

  // 추천 장소 HTML
  let plHtml='';
  if(locs&&locs.length>0){
    console.log('[DEBUG] Rendering', locs.length, 'places');
    const cards=locs.map(l=>{
      const ptype=TICON[l.place_type]?l.place_type:'default';
      const lab=TLAB[l.place_type]||'📍 장소';
      const addr=l.address||'';
      const phone=l.phone||'';

      const phoneHtml=phone?'<div style="display:flex;align-items:center;gap:6px;padding:5px 0;font-size:13px"><span>📞</span><a href="tel:'+phone+'" style="color:var(--accent);font-weight:700;text-decoration:none">'+phone+'</a></div>':'';
      const addrHtml=addr?'<div class="place-addr-row" onclick="copyAddr(\''+sa+'\')"><span>📍</span><span class="place-addr-text">'+addr+'</span><span class="place-addr-copy">탭하여 복사</span></div>':'';
      const tipHtml=l.tip?'<div class="place-tip">💬 '+l.tip+'</div>':'';
      const copyBtn=addr?'<button class="pbtn pbtn-copy" onclick="copyAddr(\''+sa+'\')">📋 주소복사</button>':'';

      // 상단 이미지 — 링크된 이미지가 있으면 사진, 없으면 같은 크기의 타입 이모지 블록

        const su=photo.replace(/"/g,'&quot;');

function copyAddr(addr){
  navigator.clipboard.writeText(addr).then(()=>toast('📋 주소 복사됨! 네비에 붙여넣기 하세요',3000)).catch(()=>{
    const el=document.createElement('textarea');el.value=addr;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el);toast('📋 주소 복사됨!');
  });
}

function addItem(){
  const div=document.createElement('div');div.className='item-row';
  div.innerHTML='<span>💊</span><input placeholder="품목명 입력"><button class="item-del" onclick="this.parentNode.remove()">×</button>';
  document.getElementById('iItemList').appendChild(div);
}

async function sendItems(jid){
  const inputs=document.querySelectorAll('#iItemList .item-row input');
  const items=[...inputs].map(i=>i.value.trim()).filter(Boolean);
  if(!items.length){toast('품목을 입력해주세요');return;}
  await Promise.all(items.map(n=>sb.from('items').insert({user_id:CU.id,journey_id:jid,item_name:n})));
  toast('품목 전송 완료! ✅');
  document.getElementById('iItemList').innerHTML='';
  loadStamp();
  // 이력 갱신
  const {data:mi}=await sb.from('items').select('*').eq('user_id',CU.id).eq('journey_id',jid).order('submitted_at',{ascending:false});
  const el=document.querySelector('.card:last-child div[style*="제출 이력"]');
  if(el&&mi)el.nextElementSibling.innerHTML=mi.map(i=>`<div class="irow"><div><div style="font-size:13px;font-weight:700">${i.item_name}</div><div style="font-size:11px;color:var(--muted)">방금</div></div><span class="badge badge-blue">검토중</span></div>`).join('');
}

// ====== GPS ======
function activateGPS(e){
  if(e)e.stopPropagation();
  if(!CJ?.hotel_lat||!CJ?.hotel_lng){toast('이 호텔은 GPS 정보가 없습니다');return;}
  if(!navigator.geolocation){toast('GPS를 지원하지 않는 기기입니다');return;}
  toast('📍 위치 확인 중...');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const d=getDist(pos.coords.latitude,pos.coords.longitude,CJ.hotel_lat,CJ.hotel_lng);
      if(d<=300)checkVisited();
      else toast(`${CJ.hotel_name} 300m 내에서 다시한번 도착인증 부탁드려요^^`,3500);
    },
    ()=>toast('GPS 오류: 위치 권한을 허용해주세요'),
    {enableHighAccuracy:true,timeout:12000}
  );
}

function startGPSWatch(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(pos=>{
    if(!CJ?.hotel_lat||spinActive)return;
    const d=getDist(pos.coords.latitude,pos.coords.longitude,CJ.hotel_lat,CJ.hotel_lng);
    if(d<=300)checkVisited();
  },{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

async function checkVisited(){
  if(!CU||!CJ)return;
  const {data}=await sb.from('visits').select('id').eq('user_id',CU.id).eq('journey_id',CJ.id).single();
  if(data){toast('이미 도착인증되셨습니다! ✅');return;}
  showSpin();
}

function getDist(la1,lo1,la2,lo2){
  const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ====== 슬라이드 스핀 ======
function showSpin(){
  spinActive=true;spinRot=0;spinTotal=0;isDragging=false;
  document.getElementById('gpsHotelName').textContent='🏨 '+CJ.hotel_name+' 도착!';
  document.getElementById('spinBar').style.width='0%';

  // 도장 상태 초기화
  const card=document.querySelector('#gpsOverlay .gps-card');
  card.classList.remove('stamped','shake');
  const st=document.getElementById('stampSlam');
  st.classList.remove('slam');
  st.style.cssText='';

  document.getElementById('gpsOverlay').classList.add('show');

  const logo=document.getElementById('spinLogo');
  logo.style.transition='';
  logo.style.transform='translate(-50%,-50%) rotate(0deg)';

  // 기존 리스너 제거를 위해 새 엘리먼트로 교체
  const newLogo=logo.cloneNode(true);
  logo.parentNode.replaceChild(newLogo,logo);

  function onTouchStart(e){
    e.preventDefault();
    isDragging=true;
    lastX=e.touches[0].clientX;
  }
  function onTouchMove(e){
    e.preventDefault();
    if(!isDragging||!spinActive)return;
    const x=e.touches[0].clientX;
    const dx=x-lastX;
    lastX=x;
    spinRot+=dx*3;         // 슬라이드 속도 배율
    spinTotal+=Math.abs(dx);
    newLogo.style.transform=`translate(-50%,-50%) rotate(${spinRot}deg)`;
    const pct=Math.min(spinTotal/400*100,100);
    document.getElementById('spinBar').style.width=pct+'%';
    if(spinTotal>=400&&spinActive)completeSpin();
  }
  function onTouchEnd(){isDragging=false;}

  newLogo.addEventListener('touchstart',onTouchStart,{passive:false});
  newLogo.addEventListener('touchmove',onTouchMove,{passive:false});
  newLogo.addEventListener('touchend',onTouchEnd,{passive:true});

  // 마우스 지원
  newLogo.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;});
  document.addEventListener('mousemove',e=>{
    if(!isDragging||!spinActive)return;
    const dx=e.clientX-lastX;lastX=e.clientX;
    spinRot+=dx*3;spinTotal+=Math.abs(dx);
    newLogo.style.transform=`translate(-50%,-50%) rotate(${spinRot}deg)`;
    document.getElementById('spinBar').style.width=Math.min(spinTotal/400*100,100)+'%';
    if(spinTotal>=400&&spinActive)completeSpin();
  });
  document.addEventListener('mouseup',()=>{isDragging=false;});
}

function cancelSpin(){spinActive=false;isDragging=false;document.getElementById('gpsOverlay').classList.remove('show');}

// ====== 도장 꽝 연출 ======
function playStamp(){
  const card=document.querySelector('#gpsOverlay .gps-card');
  const logo=document.getElementById('spinLogo');
  const st=document.getElementById('stampSlam');
  card.classList.add('stamped');

  // 나무가 마지막으로 두 바퀴 더 돌고 멈춤
  if(logo){
    logo.style.transition='transform .5s cubic-bezier(.15,.85,.25,1)';
    logo.style.transform='translate(-50%,-50%) rotate('+(Math.round(spinRot/360)*360+720)+'deg)';
  }

  // 애니메이션 재생 리셋
  st.classList.remove('slam');
  void st.offsetWidth;

  setTimeout(()=>{
    st.classList.add('slam');
    // 도장이 닿는 순간 — 흔들림 + 잉크 튐 + 진동
    setTimeout(()=>{
      card.classList.add('shake');
      inkSplatter();
      try{if(navigator.vibrate)navigator.vibrate([0,35,45,70]);}catch(e){}
      setTimeout(()=>card.classList.remove('shake'),450);
    },340);
  },420);
}

function inkSplatter(){
  const wrap=document.querySelector('#gpsOverlay .spin-wrap');
  if(!wrap)return;
  for(let i=0;i<18;i++){
    const d=document.createElement('div');
    const ang=Math.random()*Math.PI*2;
    const dist=62+Math.random()*58;
    const sz=3+Math.random()*6;
    d.style.cssText='position:absolute;top:50%;left:50%;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:#d8232a;opacity:.8;z-index:4;pointer-events:none;transform:translate(-50%,-50%) scale(1);transition:transform .55s cubic-bezier(.1,.8,.3,1),opacity .6s ease-out;';
    wrap.appendChild(d);
    requestAnimationFrame(()=>{
      d.style.transform='translate(calc(-50% + '+(Math.cos(ang)*dist).toFixed(1)+'px),calc(-50% + '+(Math.sin(ang)*dist).toFixed(1)+'px)) scale(.35)';
      d.style.opacity='0';
    });
    setTimeout(()=>d.remove(),750);
  }
}

async function completeSpin(){
  if(!spinActive)return;
  spinActive=false;isDragging=false;

  const t0=Date.now();
  playStamp();

  const {data}=await sb.from('visits').insert({user_id:CU.id,journey_id:CJ.id,gps_score:10,photo_score:0,item_score:0}).select().single();
  if(data){
    visitId=data.id;
    await sb.from('symposium_history').insert({user_id:CU.id,journey_id:CJ.id});
  }

  // 도장 연출이 끝난 뒤 완료 화면으로 전환
  const wait=Math.max(0,1650-(Date.now()-t0));
  setTimeout(()=>{
    document.getElementById('gpsOverlay').classList.remove('show');
    document.getElementById('doneHotelName').textContent=CJ.hotel_name;
    document.getElementById('doneOverlay').classList.add('show');
    launchConfetti();
  },wait);

  loadStamp();
}

function launchConfetti(){
  const cols=['#3b6ef5','#18b96a','#f59e0b','#e74c3c','#6c47d4','#4f8ef7'];
  // PC에서는 body가 430px 프레임이므로 폭죽도 프레임 안에서만 떨어지게 함
  const r=document.body.getBoundingClientRect();
  const fLeft=r.left+window.scrollX;
  const fWidth=r.width||window.innerWidth;
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.style.cssText='position:fixed;top:-10px;left:'+(fLeft+Math.random()*fWidth)+'px;width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';z-index:700;pointer-events:none;animation:fall '+(1.5+Math.random()*2)+'s ease-in forwards;';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4000);
    },Math.random()*1200);
  }
}

function afterComplete(){document.getElementById('doneOverlay').classList.remove('show');document.getElementById('photoInput').click();}
function skipPhoto(){document.getElementById('doneOverlay').classList.remove('show');toast('방문 인증 완료! +10점 🎉');}

async function uploadPhoto(input){
  const file=input.files[0];if(!file||!visitId)return;
  toast('사진 업로드 중...');
  const path=`visit_${visitId}_${Date.now()}.jpg`;
  const {error}=await sb.storage.from('agenda-images').upload(path,file,{upsert:true});
  if(error){toast('업로드 실패');return;}
  const {data:{publicUrl}}=sb.storage.from('agenda-images').getPublicUrl(path);
  await sb.from('visits').update({photo_url:publicUrl,photo_score:5}).eq('id',visitId);
  toast('사진 업로드 완료! +5점 🎉');loadStamp();
}

// ====== 도장판 ======
async function loadStamp(){
  if(!CU)return;
  const {data:vs}=await sb.from('visits').select('*,journeys(hotel_name,symposium_date,symposium_date_end)').eq('user_id',CU.id);
  if(!vs)return;
  _visits=vs;
  const g=vs.reduce((s,v)=>s+(v.gps_score||0),0);
  const p=vs.reduce((s,v)=>s+(v.photo_score||0),0);
  const it=vs.reduce((s,v)=>s+(v.item_score||0),0);
  document.getElementById('totalScore').textContent=g+p+it;
  document.getElementById('gpsTotal').textContent=g;
  document.getElementById('photoTotal').textContent=p;
  document.getElementById('itemTotal').textContent=it;
  const months=new Set();
  vs.forEach(v=>{const d=v.journeys?.symposium_date||v.visited_at||'';if(d.length>=7)months.add(d.slice(0,7));});
  const sorted=[...months].sort().reverse();
  const mf=document.getElementById('stampMF');
  if(sorted.length){
    let h='<span class="mc active" data-m="all" onclick="filterStamp(this.dataset.m)">전체</span>';
    sorted.forEach(m=>{const pt=m.split('-');h+=`<span class="mc" data-m="${m}" onclick="filterStamp(this.dataset.m)">${pt[0]}년 ${parseInt(pt[1])}월</span>`;});
    mf.innerHTML=h;
  }
  renderStamp(vs);
}

function filterStamp(m){
  document.querySelectorAll('#stampMF .mc').forEach(c=>c.classList.toggle('active',c.dataset.m===m));
  renderStamp(m==='all'?_visits:_visits.filter(v=>(v.journeys?.symposium_date||v.visited_at||'').startsWith(m)));
}

// 행사 기간을 26.8.15~16 형태로 압축 표기
function fmtPeriod(start,end){
  if(!start)return '';
  const sp=String(start).split('-');
  if(sp.length<3)return String(start);
  const sy=sp[0].slice(2),sm=parseInt(sp[1],10),sd=parseInt(sp[2].slice(0,2),10);
  const head=sy+'.'+sm+'.'+sd;
  if(!end||end===start)return head;
  const ep=String(end).split('-');
  if(ep.length<3)return head;
  const ey=ep[0].slice(2),em=parseInt(ep[1],10),ed=parseInt(ep[2].slice(0,2),10);
  if(ey===sy&&em===sm)return head+'~'+ed;          // 같은 달
  if(ey===sy)return head+'~'+em+'.'+ed;            // 같은 해, 다른 달
  return head+'~'+ey+'.'+em+'.'+ed;                // 해가 넘어감
}

function renderStamp(vs){
  document.getElementById('stampGrid').innerHTML=vs.length?vs.map(v=>{
    const j=v.journeys||{};
    const period=fmtPeriod(j.symposium_date,j.symposium_date_end);
    return `
    <div class="stamp-item done">
      <img class="stamp-img" src="${NAMU}">
      <div class="stamp-name">${(j.hotel_name||'').slice(0,8)}</div>
      ${period?`<div class="stamp-date">${period}</div>`:''}
      <div class="stamp-score">${(v.gps_score||0)+(v.photo_score||0)+(v.item_score||0)}점</div>
    </div>`;
  }).join(''):'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;grid-column:1/-1">방문 기록 없음</div>';
}
</script>
