<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SYMPOVOY 사용자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f8;
  --accent:#3b6ef5;--green:#18b96a;--red:#e74c3c;--yellow:#f59e0b;
  --text:#1a1d2e;--muted:#7b82a0;--border:#e2e5f0;--radius:16px;
}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo',sans-serif;min-height:100vh;}

/* 로그인 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 28px;width:100%;max-width:380px;backdrop-filter:blur(20px);}
.login-logo{font-size:44px;margin-bottom:10px;text-align:center;}
.login-title{font-size:24px;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:4px;text-align:center;}
.login-title span{color:#4f8ef7;}
.login-sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px;text-align:center;}
.login-input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:13px 16px;color:#fff;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit;}
.login-input::placeholder{color:rgba(255,255,255,.35);}
.login-input:focus{border-color:#4f8ef7;}
.login-btn{width:100%;background:#4f8ef7;border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px;font-family:inherit;}
.login-hint{font-size:12px;color:rgba(255,255,255,.4);text-align:center;margin-top:14px;line-height:1.6;}

/* 대기 화면 */
.pending-wrap{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0d1a,#1a1d2e);flex-direction:column;text-align:center;}
.pending-icon{font-size:64px;margin-bottom:20px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.pending-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:8px;}
.pending-sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:24px;}
.pending-info{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 20px;margin-bottom:20px;text-align:left;width:100%;max-width:340px;}
.pending-info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;}
.pending-info-row:last-child{border-bottom:none;}
.pending-info-label{color:rgba(255,255,255,.5);}
.pending-info-val{color:#fff;font-weight:700;}
.pending-logout{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:11px 24px;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;font-family:inherit;}

/* 앱 */
.app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{font-size:17px;font-weight:900;}
.topbar-logo span{color:var(--accent);}
.topbar-user{font-size:12px;color:var(--muted);font-weight:600;}

/* 바텀 탭 */
.bottom-tab{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;}
.tab-item.active{color:var(--accent);}
.tab-icon{font-size:22px;margin-bottom:2px;}
.content{padding:16px 16px 90px;}
.page{display:none;}
.page.active{display:block;}

/* 카드 */
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
.section-title{font-size:15px;font-weight:800;margin-bottom:14px;}

/* 초대장 */
.hotel-hero{border-radius:var(--radius);padding:24px 20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;}
.hotel-hero.c1{background:linear-gradient(135deg,#1a1d2e,#2d3561);}
.hotel-hero.c2{background:linear-gradient(135deg,#fff9f0,#fff3dc);color:#1a1d2e;}
.hotel-hero.c3{background:linear-gradient(135deg,#f0f7ff,#e8f4fd);color:#1a1d2e;border-left:5px solid #3b6ef5;}
.hotel-name{font-size:22px;font-weight:900;margin-bottom:4px;}
.hotel-date{font-size:13px;opacity:.7;margin-bottom:8px;}

/* 추천장소 */
.place-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:10px;}
.place-type-icon{font-size:28px;width:44px;text-align:center;flex-shrink:0;}
.place-info{flex:1;}
.place-name{font-size:14px;font-weight:800;margin-bottom:2px;}
.place-addr{font-size:11px;color:var(--muted);margin-bottom:4px;}
.place-tip{font-size:12px;color:var(--accent);background:rgba(59,110,245,.08);border-radius:6px;padding:5px 8px;display:inline-block;}
.place-nav-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

/* 도장판 */
.score-hero{background:linear-gradient(135deg,var(--accent),#6c47d4);border-radius:var(--radius);padding:24px;text-align:center;color:#fff;margin-bottom:14px;}
.score-num{font-size:56px;font-weight:900;line-height:1;}
.score-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.score-item{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 6px;text-align:center;}
.score-item-num{font-size:20px;font-weight:800;}
.score-item-label{font-size:10px;opacity:.8;margin-top:2px;}
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stamp-item{background:var(--surface2);border-radius:12px;padding:14px 8px;text-align:center;border:2px solid transparent;}
.stamp-item.done{background:rgba(24,185,106,.08);border-color:var(--green);}
.stamp-icon{font-size:32px;margin-bottom:4px;}
.stamp-name{font-size:11px;font-weight:700;color:var(--muted);}
.stamp-item.done .stamp-name{color:var(--green);}

/* 품목 */
.item-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.item-row input{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit;}
.item-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.add-item-btn{width:100%;background:var(--surface2);border:1.5px dashed var(--border);border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;}
.submit-btn{width:100%;background:var(--accent);border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px;font-family:inherit;}

/* GPS 오버레이 */
.gps-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;flex-direction:column;}
.gps-overlay.show{display:flex;}
.gps-card{background:#fff;border-radius:28px;padding:36px 28px;text-align:center;width:90%;max-width:320px;}
.gps-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:6px;}
.gps-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.spin-area{position:relative;width:150px;height:150px;margin:0 auto 24px;}
.spin-ring{position:absolute;inset:0;border-radius:50%;border:3px dashed #e2e5f0;animation:spinRing 4s linear infinite;}
@keyframes spinRing{to{transform:rotate(360deg);}}
.spin-img{width:110px;height:110px;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:4px solid #fff;box-shadow:0 8px 32px rgba(0,0,0,.15);cursor:grab;user-select:none;font-size:56px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f7ff,#e8f4fd);}
.spin-hint{font-size:12px;color:var(--muted);margin-bottom:12px;}
.spin-progress{width:100%;height:6px;background:#f0f2f8;border-radius:3px;overflow:hidden;}
.spin-bar{height:100%;background:linear-gradient(90deg,var(--accent),#6c47d4);border-radius:3px;width:0%;transition:width .1s;}

/* 완료 */
.complete-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;align-items:center;justify-content:center;flex-direction:column;}
.complete-overlay.show{display:flex;}
.complete-card{text-align:center;color:#fff;padding:40px 20px;}
.complete-icon{font-size:80px;margin-bottom:20px;animation:popIn .5s cubic-bezier(.68,-.55,.27,1.55);}
@keyframes popIn{0%{transform:scale(0);}100%{transform:scale(1);}}
.complete-btn{background:#fff;color:#1a1d2e;border:none;border-radius:14px;padding:14px 40px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}

/* 배지 */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:rgba(24,185,106,.12);color:var(--green);}
.badge-blue{background:rgba(59,110,245,.12);color:var(--accent);}
.badge-yellow{background:rgba(245,158,11,.12);color:var(--yellow);}

/* 아젠다 */
.agenda-img{width:100%;border-radius:12px;margin-top:8px;}

/* 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(40px);background:#1a1d2e;color:#fff;padding:12px 24px;border-radius:40px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ===== 라이트 모드 ===== */
:root[data-theme="light"] {
  --bg:#f5f6fa;--surface:#ffffff;--surface2:#f0f2f8;
  --accent:#3b6ef5;--green:#18b96a;--red:#e74c3c;--yellow:#f59e0b;
  --text:#1a1d2e;--muted:#7b82a0;--border:#e2e5f0;--radius:12px;
}
/* ===== 다크 모드 ===== */
:root[data-theme="dark"] {
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
  --accent:#4f8ef7;--green:#2ecc71;--red:#e74c3c;--yellow:#f39c12;
  --text:#e8eaf0;--muted:#8890a8;--border:#2a2f45;--radius:12px;
}
.theme-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;transition:all .2s;}
.theme-btn:hover{border-color:var(--accent);}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">🌿</div>
    <div class="login-title">SYMPO<span>VOY</span></div>
    <p class="login-sub">심포지엄 도장깨기</p>
    <input class="login-input" id="lName" placeholder="이름">
    <input class="login-input" id="lHospital" placeholder="병원명">
    <input class="login-input" id="lLicense" placeholder="면허번호">
    <input class="login-input" id="lMrEmpId" placeholder="MR 사번 (8자리 숫자)" maxlength="8" inputmode="numeric">
    <button class="login-btn" onclick="doLogin()">승인 요청하기</button>
    <p class="login-hint">담당 MR에게 사번을 확인하세요<br>MR 승인 후 서비스 이용이 가능합니다</p>
  </div>
</div>

<!-- 승인 대기 화면 -->
<div class="pending-wrap" id="pendingWrap">
  <div class="pending-icon">⏳</div>
  <div class="pending-title">승인 대기 중</div>
  <div class="pending-sub">담당 MR의 승인을 기다리고 있습니다<br>승인 후 자동으로 접속됩니다</div>
  <div class="pending-info" id="pendingInfo"></div>
  <button class="pending-logout" onclick="doLogout()">다시 입력하기</button>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-logo">SYMPO<span>VOY</span></div>
    <div style="display:flex;align-items:center;gap:8px"><button class="theme-btn" onclick="toggleTheme()">🌙 다크</button><div class="topbar-user" id="topUser"></div></div>
  </div>
  <div class="content">

    <!-- 초대장 -->
    <div class="page active" id="page-invite">
      <div id="inviteContent">
        <div style="text-align:center;padding:40px 20px;color:var(--muted)">
          <div style="font-size:40px;margin-bottom:12px">🔗</div>
          <div style="font-size:15px;font-weight:700;margin-bottom:6px">초대장 없음</div>
          <div style="font-size:13px">담당 MR이 초대장을 준비 중입니다</div>
        </div>
      </div>
    </div>

    <!-- 도장판 -->
    <div class="page" id="page-stamp">
      <div class="score-hero">
        <div class="score-num" id="totalScore">0</div>
        <div style="font-size:13px;opacity:.8;margin-top:4px">누적 점수</div>
        <div class="score-breakdown">
          <div class="score-item"><div class="score-item-num" id="gpsTotal">0</div><div class="score-item-label">방문인증</div></div>
          <div class="score-item"><div class="score-item-num" id="photoTotal">0</div><div class="score-item-label">사진</div></div>
          <div class="score-item"><div class="score-item-num" id="itemTotal">0</div><div class="score-item-label">품목</div></div>
        </div>
      </div>
      <div class="section-title">🏅 방문 도장</div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>

    <!-- 품목 -->
    <div class="page" id="page-items">
      <div class="card">
        <div class="section-title">💊 강의 품목 등록</div>
        <div id="itemList"></div>
        <button class="add-item-btn" onclick="addItemRow()">+ 품목 추가</button>
        <button class="submit-btn" onclick="submitItems()">전송하기</button>
      </div>
      <div class="card">
        <div class="section-title">📋 제출 이력</div>
        <div id="itemHistory"></div>
      </div>
    </div>

  </div>

  <div class="bottom-tab">
    <div class="tab-item active" onclick="switchTab(this,'invite')">
      <span class="tab-icon">📨</span>초대장
    </div>
    <div class="tab-item" onclick="switchTab(this,'stamp')">
      <span class="tab-icon">🏅</span>도장판
    </div>
    <div class="tab-item" onclick="switchTab(this,'items')">
      <span class="tab-icon">💊</span>품목
    </div>
  </div>
</div>

<!-- GPS 오버레이 -->
<div class="gps-overlay" id="gpsOverlay">
  <div class="gps-card">
    <div class="gps-title" id="gpsHotelName">🏨 호텔 도착!</div>
    <div class="gps-sub">아래 로고를 돌려서 방문을 인증하세요</div>
    <div class="spin-area">
      <div class="spin-ring"></div>
      <div class="spin-img" id="spinImg">🌿</div>
    </div>
    <div class="spin-hint">손가락으로 빙글 돌려보세요</div>
    <div class="spin-progress"><div class="spin-bar" id="spinBar"></div></div>
  </div>
</div>

<!-- 완료 오버레이 -->
<div class="complete-overlay" id="completeOverlay">
  <div class="complete-card">
    <div class="complete-icon">✅</div>
    <div style="font-size:26px;font-weight:900;margin-bottom:8px">방문 인증 완료!</div>
    <div style="font-size:14px;opacity:.7;margin-bottom:12px" id="completeHotelName"></div>
    <div style="font-size:48px;font-weight:900;color:#4f8ef7;margin-bottom:8px">+10점</div>
    <div style="font-size:13px;opacity:.6;margin-bottom:32px">방문 인증 점수가 적립되었습니다</div>
    <button class="complete-btn" onclick="afterComplete()">사진 업로드하기 📸</button>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(this)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://sgmmeibexipozsywxpyk.supabase.co';
const SB_KEY='sb_publishable_rWGxXiyqq493Vu6cqNyfCA_8DfSMqqQ';
const sb=supabase.createClient(SB_URL,SB_KEY);

let currentUser=null;
let currentInvite=null;
let currentJourney=null;
let inviteLocations=[];
let currentVisitId=null;
let spinActive=false;
let spinRotation=0;
let totalSpinAngle=0;
let lastAngle=0;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// 로그인 - 승인 요청
async function doLogin(){
  const name=document.getElementById('lName').value.trim();
  const hospital=document.getElementById('lHospital').value.trim();
  const license=document.getElementById('lLicense').value.trim();
  const mrEmpId=document.getElementById('lMrEmpId').value.trim();
  if(!name||!hospital||!license||!mrEmpId){toast('모두 입력해주세요');return;}

  // MR 확인
  const {data:mr}=await sb.from('introducers').select('*').eq('employee_id',mrEmpId).single();
  if(!mr){toast('존재하지 않는 MR 사번입니다');return;}

  // 기존 사용자 확인
  let {data:user}=await sb.from('users').select('*').eq('license_number',license).single();
  if(user){
    // 기존 사용자 - 상태 확인
    if(user.mr_approval==='approved'){
      currentUser=user;
      localStorage.setItem('user_session',JSON.stringify(user));
      enterApp();
      return;
    }
    // 대기중
    showPending(user,mr);
    return;
  }

  // 신규 등록
  const {data:newUser}=await sb.from('users').insert({
    name,hospital,license_number:license,
    introducer_id:mr.id,
    mr_approval:'pending',
    is_approved:false
  }).select().single();

  if(!newUser){toast('오류가 발생했습니다');return;}
  localStorage.setItem('user_session',JSON.stringify(newUser));
  showPending(newUser,mr);
}

function showPending(user,mr){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('pendingWrap').style.display='flex';
  document.getElementById('pendingInfo').innerHTML=`
    <div class="pending-info-row"><span class="pending-info-label">이름</span><span class="pending-info-val">${user.name}</span></div>
    <div class="pending-info-row"><span class="pending-info-label">병원</span><span class="pending-info-val">${user.hospital}</span></div>
    <div class="pending-info-row"><span class="pending-info-label">면허번호</span><span class="pending-info-val">${user.license_number}</span></div>
    <div class="pending-info-row"><span class="pending-info-label">담당 MR</span><span class="pending-info-val">${mr?mr.name:'-'}</span></div>
  `;
  // 30초마다 승인 여부 확인
  const interval=setInterval(async()=>{
    const {data}=await sb.from('users').select('mr_approval').eq('id',user.id).single();
    if(data?.mr_approval==='approved'){
      clearInterval(interval);
      currentUser={...user,mr_approval:'approved',is_approved:true};
      localStorage.setItem('user_session',JSON.stringify(currentUser));
      toast('승인되었습니다! 🎉');
      setTimeout(()=>enterApp(),1000);
    }
  },30000);
}

function doLogout(){
  localStorage.removeItem('user_session');
  currentUser=null;
  document.getElementById('pendingWrap').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
}

function enterApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('pendingWrap').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('topUser').textContent=currentUser.name+' · '+currentUser.hospital;
  loadInvite();
  loadStamp();
  loadItemHistory();
  startGPSWatch();
}

// 자동 로그인
window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('user_session');
  if(!saved)return;
  const u=JSON.parse(saved);
  const {data}=await sb.from('users').select('*').eq('id',u.id).single();
  if(!data)return;
  if(data.mr_approval==='approved'){
    currentUser=data;
    enterApp();
  } else {
    const {data:mr}=await sb.from('introducers').select('*').eq('id',data.introducer_id).single();
    showPending(data,mr);
  }
});

function switchTab(el,id){
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+id).classList.add('active');
}

// 초대장 로드 (나에게 발송된 초대장)
async function loadInvite(){
  if(!currentUser)return;
  const {data:pkgs}=await sb.from('invite_packages').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(1);
  if(!pkgs||!pkgs.length)return;
  const pkg=pkgs[0];
  currentInvite=pkg;
  const {data:journey}=await sb.from('journeys').select('*').eq('id',pkg.journey_id).single();
  currentJourney=journey;
  const {data:locs}=await sb.from('invite_locations').select('*').eq('invite_id',pkg.id);
  inviteLocations=locs||[];

  const typeIcon={restaurant:'🍽️',attraction:'🏛️',cafe:'☕',shopping:'🛍️'};
  const cClass={1:'c1',2:'c2',3:'c3'};
  const period=journey.symposium_date+(journey.symposium_date_end?' ~ '+journey.symposium_date_end:'');

  document.getElementById('inviteContent').innerHTML=`
    <div class="hotel-hero ${cClass[pkg.concept]||'c1'}">
      <div style="font-size:11px;opacity:.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">초대장</div>
      <div class="hotel-name">🏨 ${journey.hotel_name}</div>
      <div class="hotel-date">📅 ${period||'날짜 미정'}</div>
      ${journey.symposium_name?`<div style="font-size:14px;font-weight:700;color:#4f8ef7">🎓 ${journey.symposium_name}</div>`:''}
      ${pkg.custom_message?`<div style="font-size:13px;margin-top:12px;opacity:.85;border-left:3px solid currentColor;padding-left:10px">${pkg.custom_message}</div>`:''}
    </div>
    ${journey.agenda_image_url?`<div class="card"><div class="section-title">📄 아젠다</div><img src="${journey.agenda_image_url}" class="agenda-img"></div>`:''}
    ${inviteLocations.length?`
      <div class="card">
        <div class="section-title">🗺️ 추천 장소</div>
        ${inviteLocations.map(l=>`
          <div class="place-card">
            <div class="place-type-icon">${typeIcon[l.place_type]||'📍'}</div>
            <div class="place-info">
              <div class="place-name">${l.place_name}</div>
              ${l.address?`<div class="place-addr">${l.address}</div>`:''}
              ${l.tip?`<div class="place-tip">💬 ${l.tip}</div>`:''}
              ${l.photo_url?`<img src="${l.photo_url}" style="width:100%;height:80px;object-fit:cover;border-radius:6px;margin-top:6px" onerror="this.style.display='none'">`:''}
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
              <button class="place-nav-btn" onclick="window.open('https://map.naver.com/v5/search/${encodeURIComponent(l.place_name)}','_blank')">길찾기</button>
              <button class="place-nav-btn" style="background:var(--surface2);color:var(--text);border:1px solid var(--border)" onclick="copyAddr('${(l.address||l.place_name).replace(/'/g,\"\\'\")}')" >주소복사</button>
            </div>
          </div>
        `).join('')}
      </div>
    `:''}
  `;
}

// GPS
function startGPSWatch(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(pos=>{
    if(!currentJourney?.hotel_lat)return;
    const dist=getDistance(pos.coords.latitude,pos.coords.longitude,currentJourney.hotel_lat,currentJourney.hotel_lng);
    if(dist<=300&&!spinActive) checkAlreadyVisited();
  },{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}

async function checkAlreadyVisited(){
  const {data}=await sb.from('visits').select('id').eq('user_id',currentUser.id).eq('journey_id',currentJourney.id).single();
  if(data)return;
  showSpinOverlay();
}

function getDistance(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function showSpinOverlay(){
  spinActive=true;totalSpinAngle=0;spinRotation=0;
  document.getElementById('gpsHotelName').textContent='🏨 '+currentJourney.hotel_name;
  document.getElementById('spinBar').style.width='0%';
  document.getElementById('gpsOverlay').classList.add('show');
  const img=document.getElementById('spinImg');
  const bar=document.getElementById('spinBar');
  const required=720;
  img.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    const r=img.getBoundingClientRect();
    lastAngle=Math.atan2(t.clientY-(r.top+r.height/2),t.clientX-(r.left+r.width/2))*180/Math.PI;
  },{passive:true});
  img.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.touches[0];
    const r=img.getBoundingClientRect();
    const angle=Math.atan2(t.clientY-(r.top+r.height/2),t.clientX-(r.left+r.width/2))*180/Math.PI;
    let delta=angle-lastAngle;
    if(delta>180)delta-=360;if(delta<-180)delta+=360;
    totalSpinAngle+=Math.abs(delta);spinRotation+=delta;lastAngle=angle;
    img.style.transform=`translate(-50%,-50%) rotate(${spinRotation}deg)`;
    bar.style.width=Math.min(totalSpinAngle/required*100,100)+'%';
    if(totalSpinAngle>=required)completeVisit();
  },{passive:false});
}

async function completeVisit(){
  if(!spinActive)return;spinActive=false;
  document.getElementById('gpsOverlay').classList.remove('show');
  const {data}=await sb.from('visits').insert({user_id:currentUser.id,journey_id:currentJourney.id,gps_score:10,photo_score:0,item_score:0}).select().single();
  if(data){
    currentVisitId=data.id;
    await sb.from('symposium_history').insert({user_id:currentUser.id,journey_id:currentJourney.id});
  }
  document.getElementById('completeHotelName').textContent=currentJourney.hotel_name;
  document.getElementById('completeOverlay').classList.add('show');
  loadStamp();
}

function afterComplete(){
  document.getElementById('completeOverlay').classList.remove('show');
  document.getElementById('photoInput').click();
}

async function uploadPhoto(input){
  const file=input.files[0];if(!file||!currentVisitId)return;
  toast('사진 업로드 중...');
  const path=`visit_${currentVisitId}_${Date.now()}.jpg`;
  const {error}=await sb.storage.from('agenda-images').upload(path,file,{upsert:true});
  if(error){toast('업로드 실패');return;}
  const {data:{publicUrl}}=sb.storage.from('agenda-images').getPublicUrl(path);
  await sb.from('visits').update({photo_url:publicUrl,photo_score:5}).eq('id',currentVisitId);
  toast('사진 업로드 완료! +5점');loadStamp();
}

async function loadStamp(){
  if(!currentUser)return;
  const {data:visits}=await sb.from('visits').select('*,journeys(hotel_name)').eq('user_id',currentUser.id);
  if(!visits)return;
  const gps=visits.reduce((s,v)=>s+(v.gps_score||0),0);
  const photo=visits.reduce((s,v)=>s+(v.photo_score||0),0);
  const item=visits.reduce((s,v)=>s+(v.item_score||0),0);
  document.getElementById('totalScore').textContent=gps+photo+item;
  document.getElementById('gpsTotal').textContent=gps;
  document.getElementById('photoTotal').textContent=photo;
  document.getElementById('itemTotal').textContent=item;
  document.getElementById('stampGrid').innerHTML=visits.length?visits.map(v=>`
    <div class="stamp-item done">
      <div class="stamp-icon">✅</div>
      <div class="stamp-name">${(v.journeys?.hotel_name||'').slice(0,6)}</div>
      <div style="font-size:10px;color:var(--green);margin-top:2px">${(v.gps_score||0)+(v.photo_score||0)+(v.item_score||0)}점</div>
    </div>
  `).join(''):'<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;grid-column:1/-1">방문 기록 없음</div>';
}

function addItemRow(){
  const div=document.createElement('div');div.className='item-row';
  div.innerHTML=`<span>💊</span><input placeholder="품목명 입력" type="text"><button class="item-del" onclick="this.parentNode.remove()">×</button>`;
  document.getElementById('itemList').appendChild(div);
}

async function submitItems(){
  if(!currentJourney){toast('초대장을 먼저 확인하세요');return;}
  const items=[...document.querySelectorAll('#itemList .item-row input')].map(i=>i.value.trim()).filter(Boolean);
  if(!items.length){toast('품목을 입력해주세요');return;}
  await Promise.all(items.map(name=>sb.from('items').insert({user_id:currentUser.id,journey_id:currentJourney.id,item_name:name})));
  toast('품목 전송 완료!');document.getElementById('itemList').innerHTML='';loadItemHistory();
}

function copyAddr(addr){
  navigator.clipboard.writeText(addr).then(()=>{
    toast('주소가 복사되었습니다 📋');
  }).catch(()=>{
    const el=document.createElement('textarea');
    el.value=addr;document.body.appendChild(el);
    el.select();document.execCommand('copy');
    document.body.removeChild(el);
    toast('주소가 복사되었습니다 📋');
  });
}

async function loadItemHistory(){
  if(!currentUser)return;
  const {data}=await sb.from('items').select('*,journeys(hotel_name)').eq('user_id',currentUser.id).order('submitted_at',{ascending:false});
  const el=document.getElementById('itemHistory');
  el.innerHTML=data?.length?data.map(i=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:14px;font-weight:700">${i.item_name}</div>
        <div style="font-size:11px;color:var(--muted)">${i.journeys?.hotel_name||'-'} · ${new Date(i.submitted_at).toLocaleDateString('ko-KR')}</div>
      </div>
      <span class="badge ${i.is_approved?'badge-green':'badge-blue'}">${i.is_approved?(i.approved_score||0)+'점':'검토중'}</span>
    </div>
  `).join(''):'<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">제출 이력 없음</div>';
}

function initTheme(){
  const saved=localStorage.getItem('sympovoy_theme')||'light';
  document.documentElement.setAttribute('data-theme',saved);
  updateThemeBtn();
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('sympovoy_theme',next);
  updateThemeBtn();
}
function updateThemeBtn(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.querySelectorAll('.theme-btn').forEach(b=>b.textContent=isDark?'☀️ 라이트':'🌙 다크');
}
initTheme();

</script>
